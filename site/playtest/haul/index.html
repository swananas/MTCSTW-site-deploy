<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>HAUL — Phase 0.2 · The Ladder</title>
<style>
  :root { --ink:#22312a; --paper:#f2efe6; --teal:#1f6f6b; --amber:#b97e26; --red:#b3402e; --line:#c9c2ae; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#aebfa5; font-family: ui-rounded, system-ui, -apple-system, sans-serif; color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; background:#c3d0b4; box-shadow:0 0 24px rgba(20,40,30,.25); }
  header { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--paper); border-bottom:1px solid var(--line); }
  header .brand { font-weight:800; letter-spacing:.14em; font-size:15px; }
  header .money { font-weight:800; color:var(--teal); font-size:16px; }
  #delta { font-weight:800; color:#b3402e; font-size:13.5px; min-width:52px; }
  #infl { font-weight:700; color:#5b4a8a; font-size:13.5px; }
  #events { display:none; padding:4px 10px; background:#f3e9d2; border-bottom:1px solid var(--line); font-size:12.5px; }
  #events div { padding:1px 0; }
  header .clock { margin-left:auto; font-size:12.5px; opacity:.85; text-align:right; line-height:1.25; }
  .speeds { display:flex; gap:4px; }
  .speeds button, .card button, #newgame, #boardbtn, #skillbtn, #portbtn, #mktbtn, #crownbtn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:5px 9px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .speeds button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  #map { flex:1 1 auto; width:100%; touch-action:none; display:block; }
  #ticker { background:#2b3a31; color:#dfe7da; font-size:12px; padding:6px 10px; max-height:104px; overflow:hidden; }
  #ticker div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1.5px 0; opacity:.92; }
  #ticker .pay { color:#9fd6a4; } #ticker .rot { color:#f0a08e; } #ticker .warn { color:#f2cd7e; }
  #ticker .route { color:#a8cdea; } #ticker .buy { color:#d3b8ec; }
  #sheet { background:var(--paper); border-top:1px solid var(--line); padding:10px; min-height:118px; }
  .hint { font-size:13px; opacity:.85; line-height:1.5; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .card .sub { font-size:12px; opacity:.75; margin-bottom:6px; line-height:1.4; }
  .card table { width:100%; border-collapse:collapse; font-size:13px; margin:4px 0 8px; }
  .card td { padding:2.5px 0; } .card td.r { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:5px; background:#e3ddc9; border-radius:3px; overflow:hidden; width:86px; display:inline-block; vertical-align:middle; }
  .bar i { display:block; height:100%; background:var(--teal); }
  .card .row { display:flex; flex-wrap:wrap; gap:6px; }
  .card button.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
  .card button:disabled { opacity:.45; }
  .status { font-size:12.5px; padding:2px 0; opacity:.9; }
  #routes { font-size:12.5px; padding:6px 10px; background:#e9e4d2; border-top:1px solid var(--line); display:none; }
  #routes span { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:20px; padding:3px 6px 3px 10px; margin:2px 3px 2px 0; cursor:pointer; }
  #routes span.sel { border-color:var(--teal); background:#e2efec; }
  #routes b { cursor:pointer; color:var(--red); padding:0 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">HAUL</div>
    <div class="money" id="money">$750</div>
    <span id="delta"></span>
    <span id="infl" title="Influence with the State"></span>
    <div class="speeds" id="speeds">
      <button data-s="0">⏸</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
    <canvas id="ring" width="36" height="36" style="flex:none" title="Outer arc: the season · inner arc: the day"></canvas>
    <div class="clock" id="clock">Day 1 · 00:00</div>
    <button id="boardbtn" title="Contracts board">📋</button>
    <button id="skillbtn" title="Company skills">🎓</button>
    <button id="portbtn" title="Portfolio — units & titles">🏦</button>
    <button id="mktbtn" title="The Market — shares, loans, the State">📈</button>
    <button id="crownbtn" title="The Crown — regional control & the Era Report">👑</button>
    <button id="viewbtn" title="Reset view" style="display:none">⤢</button>
    <button id="newgame" title="Start over">↺</button>
  </header>
  <canvas id="map"></canvas>
  <div id="events"></div>
  <div id="routes"></div>
  <div id="ticker"></div>
  <div id="sheet"></div>
</div>

<script type="module">
import { createWorld, restore, snapshot, queueIntent, flushIntents, tick, stockOf, distance, routeQuote, capOf, waterDistance, shipCallDays, fisheryFactor, railDistance, ICE_MULT, TRACK_COST_PER_KM, YARD_COST, WATER_NODES, NODES, GOODS, VEHICLES, EDGES, SKILLS, UNITS, PRIMARY_UNIT, unitValue, unitManifest, positionsAt, availOf, HOUSES, STATE_DECK, EVENT_DECK, COASTAL, sharePrice, houseEquity, loanOwed, parcelPrice, eraReport, GROUNDS, LEVERAGES, OPENING_PRESETS, coverageOf, truckPos } from './engine.js';

const SAVE_KEY = 'haul-save-v14';
const CURRENT_PHASE = 1.4;
// Purchases apply the moment they're tapped — money moves NOW, even paused.
const Q = it => { queueIntent(w, it); flushIntents(w); renderSheet(); };
// Map view: pinch / double-tap zoom, drag to pan (world CSS px -> screen CSS px)
const view = { s: 1, ox: 0, oy: 0 };
let w;
function bootWorld() {
  let start = {};
  try { start = JSON.parse(localStorage.getItem('haul-start') ?? '{}'); } catch { /* a bad start note never bricks the dock */ }
  return createWorld(20261106, { mode: start.mode === 'sandbox' ? 'sandbox' : 'campaign', ground: start.ground, leverage: start.leverage });
}
try { const s = localStorage.getItem(SAVE_KEY); w = s ? restore(s) : bootWorld(); }
catch { w = createWorld(20261106); }

let speed = 1, sel = null, pendingRoute = null, panel = null, trackMode = false, lastTickAt = performance.now(), acc = 0;
const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// Hotfix 0.4.2 (Shane: "Can't delete routes"): rebuilding innerHTML replaces
// the element under the player's finger, so a tap that starts on one copy of
// a button and ends on the next never becomes a click. Two rules fix it:
// render only when the HTML actually changes, and never repaint a panel
// within 400ms of a touch landing on it.
const _lastHTML = new Map(), _touchedAt = new Map();
function setHTML(el, html) { if (_lastHTML.get(el) === html) return false; _lastHTML.set(el, html); el.innerHTML = html; return true; }
function touched(el) { return performance.now() - (_touchedAt.get(el) ?? -1e9) < 400; }
for (const id of ['sheet', 'routes']) { const el = $(id); el.addEventListener('pointerdown', () => _touchedAt.set(el, performance.now()), true); }

function save() { try { localStorage.setItem(SAVE_KEY, snapshot(w)); } catch {} }
$('newgame').onclick = () => { panel = panel === 'start' ? null : 'start'; renderSheet(); };
$('boardbtn').onclick = () => { panel = panel === 'board' ? null : 'board'; renderSheet(); };
$('skillbtn').onclick = () => { panel = panel === 'skills' ? null : 'skills'; renderSheet(); };
$('portbtn').onclick = () => { panel = panel === 'portfolio' ? null : 'portfolio'; renderSheet(); };
$('mktbtn').onclick = () => { panel = panel === 'market' ? null : 'market'; renderSheet(); };
$('crownbtn').onclick = () => { panel = panel === 'crown' ? null : 'crown'; renderSheet(); };
$('speeds').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = +b.dataset.s;
  document.querySelectorAll('#speeds button').forEach(x => x.classList.toggle('on', x === b));
};

function fit() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', fit);
const WX0 = -70, WXSPAN = 170; // the chart's west edge (Wave 5): Texas runs to x −64, Louisiana to 100
function pt(id) {
  const r = cv.getBoundingClientRect(), n = NODES[id];
  return { x: ((n.x - WX0) / WXSPAN) * r.width, y: (n.y / 100) * r.height };
}
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / L2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

// what is this truck doing, in plain words
function statusText(v) {
  const r = w.routes.find(x => x.id === v.routeId);
  if (v.phase === 'loading') return `loading ${v.cargo.qty.toFixed(0)}t ${GOODS[v.cargo.good].name.toLowerCase()} at ${NODES[v.at].name}`;
  if (v.phase === 'unloading') return `unloading at ${NODES[v.at].name}`;
  if (v.phase === 'travel' && v.leg) {
    const left = Math.max(0, Math.round(v.leg.km - v.leg.progress));
    return v.cargo ? `hauling ${v.cargo.qty.toFixed(0)}t ${GOODS[v.cargo.good].name.toLowerCase()} → ${NODES[v.leg.to].name} · ${left} km out`
                   : `heading back to ${NODES[v.leg.to].name} · ${left} km out`;
  }
  if (r?.paused) return `parked — route paused`;
  if (r && VEHICLES[v.type].mode === 'water' && waterDistance(r.from, r.to) >= 999) return `beached — no water runs between these places`;
  if (r && VEHICLES[v.type].mode === 'rail' && railDistance(w, r.from, r.to) >= 999) return `no iron — trains need yards at both ends and laid track between them`;
  if (r && v.at === r.from) {
    const q = routeQuote(w, r.from, r.to);
    return q && stockOf(w, r.from, q.good) > 0.05 ? `ready at ${NODES[v.at].name}` : `waiting at ${NODES[v.at].name} — nothing to carry yet`;
  }
  if (r) return `repositioning to ${NODES[r.from].name}`;
  return `idle at ${NODES[v.at].name} — no route`;
}

// --- drawing ---
function draw(now) {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, r.height);
  g.addColorStop(0, '#c9d6bd'); g.addColorStop(1, '#a9bda0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
  ctx.strokeStyle = 'rgba(110,150,160,.35)'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(r.width * .68, -10); ctx.bezierCurveTo(r.width * .60, r.height * .35, r.width * .78, r.height * .6, r.width * .74, r.height + 10); ctx.stroke();
  ctx.lineWidth = 1;

  // the real corridors, faint — nothing else pretends to be a road
  ctx.strokeStyle = 'rgba(60,80,60,.22)';
  for (const [a, b] of EDGES) {
    const pa = pt(a), pb = pt(b);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  // laid iron: heavy dark line once down, dashed while the crews work
  for (const key of Object.keys(w.track)) {
    const [a, b] = key.split('|');
    const pa = pt(a), pb = pt(b);
    const done = w.track[key].doneTick <= w.tick;
    ctx.strokeStyle = done ? 'rgba(38,34,30,.9)' : 'rgba(38,34,30,.4)';
    ctx.lineWidth = done ? 3.4 : 2;
    if (!done) ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
  }
  // player routes
  for (const rt of w.routes) {
    const a = pt(rt.from), b = pt(rt.to);
    const isSel = sel?.kind === 'route' && sel.id === rt.id;
    const hasBarge = w.vehicles.some(v => v.routeId === rt.id && v.type === 'barge');
    ctx.strokeStyle = rt.paused ? 'rgba(120,120,110,.5)' : hasBarge ? 'rgba(47,95,158,.85)' : isSel ? '#14524e' : 'rgba(31,111,107,.8)';
    ctx.lineWidth = isSel ? 3.5 : 2.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.moveTo(b.x - Math.cos(ang) * 16, b.y - Math.sin(ang) * 16);
    ctx.lineTo(b.x - Math.cos(ang - .45) * 24, b.y - Math.sin(ang - .45) * 24);
    ctx.lineTo(b.x - Math.cos(ang + .45) * 24, b.y - Math.sin(ang + .45) * 24);
    ctx.fill(); ctx.lineWidth = 1;
  }
  // vehicles
  for (const v of w.vehicles) {
    let p = null;
    if (v.phase === 'travel' && v.leg) {
      const a = pt(v.leg.from), b = pt(v.leg.to), f = v.leg.km ? v.leg.progress / v.leg.km : 0;
      p = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    } else if (v.at) p = pt(v.at);
    if (!p) continue;
    ctx.fillStyle = v.cargo ? '#22312a' : '#5a6e60';
    ctx.beginPath(); ctx.arc(p.x, p.y, v.type === 'semi' ? 5 : v.type === 'barge' ? 6.5 : 4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke(); ctx.lineWidth = 1;
  }
  // rival trucks: the houses' own freight, in their paint (W27)
  { const r0 = cv.getBoundingClientRect();
    for (const t of w.rivalTrucks) {
      const tp = truckPos(w, t), s = { x: ((tp.x - WX0) / WXSPAN) * r0.width, y: (tp.y / 100) * r0.height };
      ctx.fillStyle = HOUSES[t.house].paint;
      ctx.beginPath(); ctx.roundRect(s.x - 5, s.y - 3.5, 10, 7, 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.lineWidth = 1;
      if (t.cargo > 0) { ctx.fillStyle = '#22312a'; ctx.fillRect(s.x - 2, s.y - 1.5, 4, 3); }
    } }
  // first-run pulse: start here
  if (!w.routes.length) {
    const p = pt('caneA'), rad = 18 + 5 * Math.sin(now / 300);
    ctx.strokeStyle = 'rgba(31,111,107,.65)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
  }
  // nodes
  for (const [id, def] of Object.entries(NODES)) {
    const p = pt(id), node = w.nodes[id];
    const lots = node.lots.filter(l => l.good === 'shrimp');
    if (lots.length) {
      const oldest = lots.reduce((a, b) => a.born < b.born ? a : b);
      const remain = Math.max(0, 1 - (w.tick - oldest.born) * (ICE_MULT[id] ?? 1) / GOODS.shrimp.perishHours);
      ctx.strokeStyle = remain > .5 ? '#3e9e5f' : remain > .25 ? '#b97e26' : '#b3402e';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 17, -Math.PI / 2, -Math.PI / 2 + remain * Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
    }
    const isSel = sel?.kind === 'node' && sel.id === id;
    ctx.fillStyle = isSel ? '#fff8e2' : '#f5f1e4';
    ctx.strokeStyle = 'rgba(34,49,42,.55)'; ctx.lineWidth = isSel ? 2.4 : 1.2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, 7); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#22312a'; ctx.font = '700 9px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(def.name.split(' ').map(s => s[0]).slice(0, 2).join(''), p.x, p.y + 3);
    ctx.font = '9.5px system-ui'; ctx.fillStyle = 'rgba(34,49,42,.85)';
    ctx.fillText(def.name, p.x, p.y + 24);
    let i = 0;
    for (const good of Object.keys(GOODS)) {
      const q = stockOf(w, id, good);
      if (q >= 1) {
        ctx.fillStyle = 'rgba(31,111,107,.8)';
        ctx.fillRect(p.x - 14 + i * 7, p.y - 20, Math.min(6, 1 + q / 12), 3.5);
        i++;
      }
    }
  }
  // THE MAP QUOTES YOU: with a place selected, every destination shows its money
  // (in track mode, it quotes iron instead)
  if (sel?.kind === 'node') {
    ctx.font = '700 10.5px system-ui'; ctx.textAlign = 'center';
    for (const id of Object.keys(NODES)) {
      if (id === sel.id) continue;
      const p = pt(id);
      if (trackMode) {
        const edge = EDGES.find(([a, b]) => (a === sel.id && b === id) || (a === id && b === sel.id));
        if (!edge) continue;
        const laid = w.track[[sel.id, id].sort().join('|')];
        const text = laid ? (laid.doneTick > w.tick ? '🛤 laying…' : '🛤 iron down') : `🛤 lay track · $${(TRACK_COST_PER_KM * edge[2] / 1000).toFixed(0)}k`;
        const width = ctx.measureText(text).width + 12;
        ctx.fillStyle = laid ? '#38332c' : '#7a2d20'; ctx.beginPath(); ctx.roundRect(p.x - width / 2, p.y - 40, width, 16, 8); ctx.fill();
        ctx.fillStyle = '#f2efe6'; ctx.fillText(text, p.x, p.y - 28.5);
        continue;
      }
      const existing = w.routes.find(rt => rt.from === sel.id && rt.to === id);
      const q = routeQuote(w, sel.id, id);
      let text = null, bg = '#22312a';
      if (existing) { text = '▸ running — tap to open'; bg = '#1f6f6b'; }
      else if (q && q.spreadPerTon > 0) text = `+$${q.spreadPerTon.toFixed(0)}/t · ${GOODS[q.good].name}`;
      if (!text) continue;
      const width = ctx.measureText(text).width + 12;
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(p.x - width / 2, p.y - 40, width, 16, 8); ctx.fill();
      ctx.fillStyle = '#f2efe6'; ctx.fillText(text, p.x, p.y - 28.5);
    }
  }
}

// --- sheets ---
function goodsRows(id) {
  const def = NODES[id], rows = [];
  for (const [good, g] of Object.entries(GOODS)) {
    const q = stockOf(w, id, good), price = w.nodes[id].prices[good];
    const role = def.converts?.in === good ? 'feeds on it' : def.produces?.[good] ? 'produces' : def.consumes?.[good] ? (def.export ? 'exports' : 'consumes') : null;
    if (!role && q < 0.05 && !price) continue;
    const cap = capOf(w, id, good);
    const pct = cap === Infinity ? 12 : Math.min(100, q / cap * 100);
    rows.push(`<tr><td>${g.name} ${role ? `<span style="opacity:.6">· ${role}</span>` : ''}</td>
      <td><span class="bar"><i style="width:${pct}%"></i></span></td>
      <td class="r">${q.toFixed(1)}${cap === Infinity ? '' : '/' + cap}t</td><td class="r">${price ? '$' + price.toFixed(0) + '/t' : '—'}</td></tr>`);
  }
  return rows.join('') || '<tr><td style="opacity:.6">Nothing here yet.</td></tr>';
}
function renderBoard(el) {
  const open = w.contracts.filter(c => c.state === 'open');
  const taken = w.contracts.filter(c => c.state === 'taken');
  const done = w.contracts.filter(c => c.state === 'done').length;
  const line = c => `<div class="status" style="display:flex;justify-content:space-between;gap:8px;align-items:center">
    <span>${c.standing ? '🔁 ' : ''}<b>${c.qty}t ${GOODS[c.good].name}</b> → ${NODES[c.issuer].name} · <b>$${c.pricePerTon}/t</b> · by Day ${Math.floor(c.deadlineTick / 24) + 1}${c.state === 'taken' ? ` · ${c.delivered.toFixed(0)}/${c.qty}t in` : ''}</span>
    ${c.state === 'open' ? `<button data-take="${c.id}">Take</button>` : ''}</div>`;
  if (!setHTML(el, `<div class="card"><h3>📋 Contracts board</h3>
    <div class="sub">Born from real shortages — nobody posts for what nobody lacks. Deliveries to the named place count automatically; missing a deadline costs only the premium. ${done} fulfilled so far.</div>
    ${taken.length ? '<div style="font-weight:700;margin-top:4px">Yours</div>' + taken.map(line).join('') : ''}
    ${open.length ? '<div style="font-weight:700;margin-top:4px">Open</div>' + open.map(line).join('') : '<div class="status" style="opacity:.7">Nothing open right now — the morning brings new want.</div>'}
    </div>`)) return;
  el.querySelectorAll('[data-take]').forEach(b => b.onclick = () => Q({ type: 'takeContract', contractId: +b.dataset.take }));
}
function renderSkills(el) {
  const branchHtml = branch => Object.entries(SKILLS).filter(([, s]) => s.branch === branch).sort((a, b) => a[1].tier - b[1].tier).map(([id, s]) => {
    const owned = w.skills.owned[id];
    const prev = Object.entries(SKILLS).find(([, x]) => x.branch === branch && x.tier === s.tier - 1);
    const prevOk = s.tier === 1 || (prev && w.skills.owned[prev[0]]);
    const cost = s.cost ?? 1;
    const lockedPhase = (s.phase ?? 0.2) > CURRENT_PHASE + 1e-9;
    return `<div class="status" style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <span>${owned ? '✓' : '·'} <b>${s.name}</b> — ${s.blurb}${lockedPhase ? ` <i>(lands Phase ${s.phase})</i>` : ''}</span>
      ${owned ? '' : `<button data-skill="${id}" ${!prevOk || lockedPhase || w.skills.points < cost ? 'disabled' : ''}>${cost} pt</button>`}</div>`;
  }).join('');
  if (!setHTML(el, `<div class="card"><h3>🎓 Company skills — ${w.skills.points} point${w.skills.points === 1 ? '' : 's'} banked</h3>
    <div class="sub">Earned by seasons survived and milestones. No respec mid-era: the tree is the company's shape.</div>
    <div style="font-weight:700;margin-top:4px">LOGISTICS</div>${branchHtml('LOGISTICS')}

    const bb = $('b-addbarge'); if (bb) bb.onclick = () => Q({ type: 'buyVehicle', vehicleType: 'barge', nodeId: rt.from, routeId: rt.id });
    const bt2 = $('b-addtrain'); if (bt2) bt2.onclick = () => Q({ type: 'buyVehicle', vehicleType: 'train', nodeId: rt.from, routeId: rt.id });
    $('b-policy').onclick = () => Q({ type: 'setPolicy', routeId: rt.id, policy: nextPolicy });
    $('b-pause').onclick = () => Q({ type: 'toggleRoute', routeId: rt.id });
    $('b-rm').onclick = () => { Q({ type: 'removeRoute', routeId: rt.id }); sel = null; };
    return;
  }
  if (!sel) {
    const q = routeQuote(w, 'caneA', 'mill');
    setHTML(el, !w.routes.length
      ? `<div class="hint"><b>Start here:</b> tap <b>Cane Field A</b> — the map will show you what every place pays for what it grows. Then tap the <b>Thibodaux Mill</b>: it pays about <b>+$${q ? q.spreadPerTon.toFixed(0) : '20'}/t</b> for cane, and your truck is already parked at the field.</div>`
      : `<div class="hint"><b>Tap a place</b> to see its stocks — and what every other place pays for what it has. <b>Tap a route</b> (or its chip below) to manage its trucks. Empire's shrimp dies in 72 hours; watch the ring.</div>`);
    return;
  }
  const id = sel.id, def = NODES[id];
  const here = w.vehicles.filter(v => v.at === id);
  const myContracts = w.contracts.filter(c => c.issuer === id && (c.state === 'open' || c.state === 'taken'));
  if (!setHTML(el, `<div class="card"><h3>${def.name}</h3>
    <div class="sub">The pills on the map are live quotes: tap a destination to draw the route and put a truck on it.${w.warehouses[id] ? ' <b>Your warehouse stands here</b> — deep storage, faster handling.' : ''}</div>
    <table>${goodsRows(id)}</table>
    ${PRIMARY_UNIT[id] ? `<div class="status">🏛 <b>${UNITS[PRIMARY_UNIT[id]].name}</b> — owned by ${w.units[PRIMARY_UNIT[id]].owner === 'player' ? '<b>you</b>' : w.units[PRIMARY_UNIT[id]].owner} · paid $${Math.round(w.units[PRIMARY_UNIT[id]].lastIncome).toLocaleString()} yesterday${w.units[PRIMARY_UNIT[id]].owner === 'player' ? ' · your freight loads ×0.9 faster here' : ''}</div>` : ''}
    <div class="status">🌍 People <b>${Math.round(w.population[id])}</b>${w.dev[id].archetype ? ` · a <b>${w.dev[id].archetype === 'agri' ? 'Agri' : w.dev[id].archetype[0].toUpperCase() + w.dev[id].archetype.slice(1)}</b> place` : ''} · pollution <b>${Math.round(w.pollution[id])}</b>${COASTAL.includes(id) ? ` · Gulf health rides on coasts like this` : ''}${w.parcels[id].owned ? ` · you hold <b>${w.parcels[id].owned}</b> parcel${w.parcels[id].owned > 1 ? 's' : ''} here (+10% unit income, cleaner air)` : ''}</div>
    ${id === 'timber' ? `<div class="status">🌲 Standing timber: <b>${Math.round(w.capital.timberStock).toLocaleString()}t</b> in the ground — the cut draws it, the woods regrow 12t a day. Under 600t the cut itself slows.</div>` : ''}
    ${w.capital.soil[id] !== undefined ? `<div class="status">🌱 Soil fertility: <b>${Math.round(w.capital.soil[id])}%</b> — a worked field tires (−0.4/day), a rested one recovers. Yields ride on it.</div>` : ''}
    <div class="status" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>Land: ${w.parcels[id].left} of 4 parcels unclaimed — land does not print.</span><span style="display:flex;gap:4px;flex:none">${w.parcels[id].left > 0 ? `<button data-parcel="${id}" ${w.money < parcelPrice(w, id) ? 'disabled' : ''}>Buy parcel · $${parcelPrice(w, id).toLocaleString()}</button>` : ''}${COASTAL.includes(id) && w.pollution[id] > 0 ? `<button data-marsh="${id}" ${w.money < 800 ? 'disabled' : ''}>Restore marsh · $800</button>` : ''}</span></div>
    ${Object.keys(GOODS).filter(g => positionsAt(w, id, g) > 0.01).map(g => `<div class="status" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>📜 You hold title to <b>${positionsAt(w, id, g).toFixed(0)}t ${GOODS[g].name}</b> here — it does not burn, rot aside; storage bleeds daily.</span><span style="display:flex;gap:4px;flex:none"><button data-psell="${g}">Sell</button></span></div>`).join('')}
    ${Object.keys(GOODS).some(g => positionsAt(w, id, g) > 0.01) ? `<div class="status" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>⚖ The State can break every corner at this node — all your titles here sold at live prices.</span><button data-release="${id}" ${w.influence < (w.posture === 'partner' ? 5 : 6) ? 'disabled' : ''}>Release orders · ${w.posture === 'partner' ? 5 : 6}⚖</button></div>` : ''}
    ${Object.keys(GOODS).filter(g => w.nodes[id].prices[g] > 0 && availOf(w, id, g) >= 5).slice(0, 4).map(g => `<div class="status" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>Hold <b>${GOODS[g].name}</b> in place — buy the title, the pile never moves.</span><button data-pbuy="${g}" ${w.money < w.nodes[id].prices[g] * 10 ? 'disabled' : ''}>Hold 10t · $${Math.round(w.nodes[id].prices[g] * 10).toLocaleString()}</button></div>`).join('')}
    ${id === 'port' ? `<div class="status">🚢 Next ships: <b>Day ${shipCallDays(w)[0]}</b> and <b>Day ${shipCallDays(w)[1]}</b> — med supplies, pharma and provisions land; your exports sail.</div>` : ''}
    ${WATER_NODES.has(id) ? `<div class="status">🌊 The river runs <b>${w.river.level.toFixed(2)}</b> — ${w.river.state === 'shallows' ? '<b>shallows: barges load half</b>' : w.river.state === 'high' ? '<b>high water: barges slow to 60%</b>' : 'fair for barges'}${w.skills.owned.dredge ? ' · your dredging buys you depth to 0.80' : ''}</div>` : ''}
    ${w.yards[id] ? `<div class="status">🛤 <b>Rail yard here.</b> ${trackMode ? 'The map is quoting iron: tap a neighbor to lay track to it.' : 'Open track mode to lay iron from here.'}</div>` : ''}
    ${(id in w.boats) ? `<div class="status">⛵ ${w.boats[id]} shrimp boats · Gulf stock <b>${Math.round(w.fishery.stock)}%</b> — nets yield ×${fisheryFactor(w).toFixed(2)}${ICE_MULT[id] ? ' · 🧊 the Ice House keeps shrimp ~3× longer here' : ' · no ice here — the clock runs honest'}</div>` : ''}
    ${myContracts.map(c => `<div class="status">📋 ${c.state === 'taken' ? 'Your contract' : 'Board'}: ${c.qty}t ${GOODS[c.good].name} at $${c.pricePerTon}/t · ${c.delivered.toFixed(0)}/${c.qty}t · by Day ${Math.floor(c.deadlineTick / 24) + 1}</div>`).join('')}
    ${here.map(v => `<div class="status">${v.type === 'barge' ? '⛴' : '🚚'} ${VEHICLES[v.type].name} — ${statusText(v)}</div>`).join('')}
    <div class="row">
      <button id="b-box" ${w.money < VEHICLES.box.cost ? 'disabled' : ''}>Buy box truck here · $${VEHICLES.box.cost}</button>
      <button id="b-semi" ${w.money < VEHICLES.semi.cost ? 'disabled' : ''}>Buy 18-wheeler here · $${VEHICLES.semi.cost}</button>
      ${w.warehouses[id] ? '' : `<button id="b-wh" ${w.money < 2400 ? 'disabled' : ''}>Build warehouse · $2,400</button>`}
      ${(id in w.boats) ? `<button id="b-boat" ${w.money < 2200 ? 'disabled' : ''}>Buy shrimp boat · $2,200</button>` : ''}
      ${w.yards[id] ? `<button id="b-track" class="primary">🛤 ${trackMode ? 'Track mode: ON — tap a neighbor' : 'Lay track from here'}</button>` : `<button id="b-yard" ${w.money < YARD_COST ? 'disabled' : ''}>Build rail yard · $${YARD_COST.toLocaleString()}</button>`}
    </div></div>`)) return;
  $('b-box').onclick = () => Q({ type: 'buyVehicle', vehicleType: 'box', nodeId: id });
  $('b-semi').onclick = () => Q({ type: 'buyVehicle', vehicleType: 'semi', nodeId: id });
  const wh = $('b-wh'); if (wh) wh.onclick = () => Q({ type: 'buyWarehouse', nodeId: id });
  const bt = $('b-boat'); if (bt) bt.onclick = () => Q({ type: 'buyBoat', nodeId: id });
  const yd = $('b-yard'); if (yd) yd.onclick = () => Q({ type: 'buildYard', nodeId: id });
  const tm = $('b-track'); if (tm) tm.onclick = () => { trackMode = !trackMode; renderSheet(); };
  el.querySelectorAll('[data-pbuy]').forEach(b => b.onclick = () => Q({ type: 'buyReceipt', nodeId: id, good: b.dataset.pbuy, qty: 10 }));
  el.querySelectorAll('[data-psell]').forEach(b => b.onclick = () => Q({ type: 'sellReceipt', nodeId: id, good: b.dataset.psell, qty: 1e9 }));
  el.querySelectorAll('[data-parcel]').forEach(b => b.onclick = () => Q({ type: 'buyParcel', nodeId: b.dataset.parcel }));
  el.querySelectorAll('[data-marsh]').forEach(b => b.onclick = () => Q({ type: 'restoreMarsh', nodeId: b.dataset.marsh }));
  el.querySelectorAll('[data-release]').forEach(b => b.onclick = () => Q({ type: 'stateAction', action: 'release', nodeId: b.dataset.release }));
}
function renderRoutes() {
  const el = $('routes');
  if (!w.routes.length) { el.style.display = 'none'; return; }
  if (touched(el)) return; // a finger is on the chips — don't swap them mid-tap
  el.style.display = 'block';
  const html = w.routes.map(r => {
    const n = w.vehicles.filter(v => v.routeId === r.id).length;
    return `<span data-sel="${r.id}" class="${sel?.kind === 'route' && sel.id === r.id ? 'sel' : ''}">${NODES[r.from].name} → ${NODES[r.to].name} · ${n}🚚 · $${r.earned.toLocaleString()}<b data-rm="${r.id}">✕</b></span>`;
  }).join('');
  if (!setHTML(el, html)) return;
  el.querySelectorAll('[data-sel]').forEach(s => s.onclick = e => {
    if (e.target.dataset.rm) return;
    sel = { kind: 'route', id: +s.dataset.sel }; renderSheet();
  });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => Q({ type: 'removeRoute', routeId: +b.dataset.rm }));
}
function renderEvents() {
  const el = $('events');
  if (!w.events.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  setHTML(el, w.events.map(ev => {
    const card = EVENT_DECK.find(c => c.id === ev.card);
    const active = w.tick >= ev.startsTick && w.tick <= ev.endsTick;
    return `<div>${active ? '🔴' : '🌀'} <b>${card.name}</b> — ${active ? `running, ends Day ${Math.floor(ev.endsTick / 24) + 1}` : `expected ~Day ${Math.floor(ev.startsTick / 24) + 1}`}${ev.card === 'hurricane' && ev.revealed ? ` · landfall: <b>${NODES[ev.landfall].name}</b>` : ''}</div>`;
  }).join(''));
}
function renderTicker() {
  setHTML($('ticker'), w.ticker.slice(-5).reverse().map(t => `<div class="${t.kind}">${t.text}</div>`).join(''));
}

// --- input: tap-tap connects · drag pans · pinch & double-tap zoom ---
const pointers = new Map();
let downAt = null, dragged = false, pinchD = 0, lastTap = { t: 0, x: 0, y: 0 };
function toWorld(e) {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  return { x: (x - view.ox) / view.s, y: (y - view.oy) / view.s, sx: x, sy: y };
}
function clampView() {
  const r = cv.getBoundingClientRect();
  view.s = Math.max(1, Math.min(3.5, view.s));
  const mx = (view.s - 1) * r.width + 70, my = (view.s - 1) * r.height + 70;
  view.ox = Math.max(-mx, Math.min(70, view.ox));
  view.oy = Math.max(-my, Math.min(70, view.oy));
  $('viewbtn').style.display = view.s > 1.02 ? '' : 'none';
}
function zoomAt(sx, sy, ns) {
  const r = cv.getBoundingClientRect();
  const wx = (sx - view.ox) / view.s, wy = (sy - view.oy) / view.s;
  view.s = Math.max(1, Math.min(3.5, ns));
  view.ox = sx - wx * view.s; view.oy = sy - wy * view.s;
  clampView();
}
$('viewbtn').onclick = () => { view.s = 1; view.ox = 0; view.oy = 0; clampView(); };
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, view.s * (e.deltaY < 0 ? 1.12 : 0.89)); }, { passive: false });
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; dragged = false; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); dragged = true; }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), r = cv.getBoundingClientRect();
    if (pinchD > 0) zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, view.s * d / pinchD);
    pinchD = d;
  } else if (pointers.size === 1 && downAt) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 9) dragged = true;
    if (dragged && view.s > 1) { view.ox += dx; view.oy += dy; clampView(); }
  }
});
cv.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchD = 0;
  if (dragged || !downAt || performance.now() - downAt.t > 600) { downAt = null; return; }
  downAt = null;
  const p = toWorld(e);
  // double-tap toggles zoom on the spot
  const now = performance.now();
  if (now - lastTap.t < 330 && Math.hypot(p.sx - lastTap.x, p.sy - lastTap.y) < 44) {
    zoomAt(p.sx, p.sy, view.s > 1.4 ? 1 : 2.3);
    lastTap = { t: 0, x: 0, y: 0 };
    return;
  }
  lastTap = { t: now, x: p.sx, y: p.sy };
  handleTap(p.x, p.y);
});
cv.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); downAt = null; });
function handleTap(x, y) {
  panel = null;
  let hit = null, best = 32 / view.s;
  for (const id of Object.keys(NODES)) {
    const p = pt(id), d = Math.hypot(p.x - x, p.y - y);
    if (d < best) { best = d; hit = id; }
  }
  if (hit) {
    if (trackMode && sel?.kind === 'node' && sel.id !== hit) {
      const key = [sel.id, hit].sort().join('|');
      if (EDGES.some(([a, b]) => [a, b].sort().join('|') === key) && !w.track[key]) {
        Q({ type: 'layTrack', a: sel.id, b: hit });
        renderSheet(); return;
      }
    }
    if (sel?.kind === 'node' && sel.id !== hit) {
      trackMode = false;
      const existing = w.routes.find(rt => rt.from === sel.id && rt.to === hit);
      if (existing) sel = { kind: 'route', id: existing.id };
      else {
        Q({ type: 'addRoute', from: sel.id, to: hit });
        pendingRoute = { from: sel.id, to: hit };
        sel = { kind: 'node', id: hit };
      }
    } else { if (sel?.id !== hit) trackMode = false; sel = { kind: 'node', id: hit }; }
    renderSheet(); return;
  }
  // tap a route line to manage it
  for (const rt of w.routes) {
    if (segDist(x, y, pt(rt.from), pt(rt.to)) < 14 / view.s) { sel = { kind: 'route', id: rt.id }; renderSheet(); return; }
  }
  sel = null; renderSheet();
}

// --- main loop: 1 tick = 1 game-hour = 0.4s at 1x (SIM-CORE cadence) ---
let prevMoney = null, flashUntil = 0;
function frame(now) {
  const dt = now - lastTickAt; lastTickAt = now;
  if (speed > 0) {
    acc += dt;
    const per = 400 / speed;
    let n = 0;
    while (acc >= per && n++ < 40) { tick(w); acc -= per; if (w.tick % 24 === 0) save(); }
  }
  if (pendingRoute) {
    const rt = w.routes.find(x => x.from === pendingRoute.from && x.to === pendingRoute.to);
    if (rt) { sel = { kind: 'route', id: rt.id }; pendingRoute = null; renderSheet(); }
  }
  const day = Math.floor(w.tick / 24) + 1, hour = w.tick % 24;
  $('money').textContent = '$' + Math.round(w.money).toLocaleString();
  if (prevMoney !== null && w.money < prevMoney - 19) { $('delta').textContent = '−$' + Math.round(prevMoney - w.money).toLocaleString(); flashUntil = now + 1400; }
  if (now > flashUntil && $('delta').textContent) $('delta').textContent = '';
  prevMoney = w.money;
  const openCount = w.contracts.filter(c => c.state === 'open').length;
  $('boardbtn').textContent = openCount ? `📋 ${openCount}` : '📋';
  $('skillbtn').textContent = w.skills.points ? `🎓 ${w.skills.points}` : '🎓';
  const ownedUnits = Object.values(w.units).filter(u => u.owner === 'player').length;
  $('portbtn').textContent = ownedUnits ? `🏦 ${ownedUnits}` : '🏦';
  $('mktbtn').textContent = w.emancipation ? '📈 !' : '📈';
  $('crownbtn').textContent = w.crown.ending ? '👑 !' : '👑';
  $('crownbtn').textContent = w.crown.ending ? '👑 !' : '👑';
  setHTML($('clock'), `Season ${Math.floor((day - 1) / 30) + 1} · Day ${day}<br>${String(hour).padStart(2, '0')}:00`);
  draw(now); renderTicker(); renderRoutes(); renderEvents();
  { // the clock ring (kit sheet LT-02): outer arc the season, inner arc the day
    const rc = $('ring').getContext('2d');
    rc.clearRect(0, 0, 36, 36);
    rc.lineWidth = 3; rc.strokeStyle = '#e3dac4';
    rc.beginPath(); rc.arc(18, 18, 15, 0, Math.PI * 2); rc.stroke();
    rc.strokeStyle = '#c9a44e';
    rc.beginPath(); rc.arc(18, 18, 15, -Math.PI / 2, -Math.PI / 2 + (w.tick % 720) / 720 * Math.PI * 2); rc.stroke();
    rc.strokeStyle = '#7a5c1e';
    rc.beginPath(); rc.arc(18, 18, 10, -Math.PI / 2, -Math.PI / 2 + (w.tick % 24) / 24 * Math.PI * 2); rc.stroke();
  }
  $('infl').textContent = w.influence > 0 ? `⚖ ${w.influence}` : '';
  if (frame.n++ % 20 === 0 && !touched($('sheet'))) renderSheet();
  requestAnimationFrame(frame);
}
frame.n = 0;
fit(); renderSheet();
requestAnimationFrame(frame);
addEventListener('beforeunload', save);
</script>
</body>
