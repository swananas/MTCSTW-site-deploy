
<script>
/* FROG SCORE PATCH: 9.0 -> 8.9 on roster and catalog page. */
(function(){
  var path = window.location.pathname;
  if(path === '/sick-left-radicals' || path === '/the-antifascist-frog'){
    function patchFrog(){
      /* Find all text nodes containing Frog score and patch them. */
      var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
      var nodes = [];
      while(walker.nextNode()){ nodes.push(walker.currentNode); }
      nodes.forEach(function(n){
        var t = n.textContent;
        /* Look for Frog context: if this text node or nearby contains Frog and 9.0 */
        if(t.indexOf('9.0') !== -1){
          var parent = n.parentElement;
          var context = parent ? parent.textContent : '';
          /* Check if Frog is mentioned nearby (parent, grandparent, or siblings). */
          var el = parent;
          for(var i=0; i<3 && el; i++){
            if(el.textContent && el.textContent.toLowerCase().indexOf('frog') !== -1){
              n.textContent = t.replace(/9\.0/g, '8.9');
              break;
            }
            el = el.parentElement;
          }
        }
      });
    }
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', function(){ setTimeout(patchFrog, 1000); });
    } else {
      setTimeout(patchFrog, 1000);
    }
    /* Re-patch after dynamic content loads. */
    setTimeout(patchFrog, 3000);
  }
})();
</script>

   (America/Chicago, Monday reset). All 10 in a week = FULL DEPLOYMENT:
   +50 XP via ranks backend (idempotent per week) + callsign etched on the
   Vanguard Wall. Device-local medal tracking (pf_medals_v2) + backend for XP. */
(function(){

if(window.pfMedalsLoaded)return;window.pfMedalsLoaded=true;

var MEDALS=[
 {id:'vote',    glyph:'\u2605', name:'Ballot',          ev:'pf-vote-cast'},
 {id:'ballot',  glyph:'\u2622', name:'Bracket Ballot',  ev:'pf-bracket-ballot'},
 {id:'bracket', glyph:'\u2620', name:'Liquidator',      ev:'pf-bracket-liquidated'},
 {id:'traitor', glyph:'\u2716', name:'Traitor Hunter',  ev:'pf-traitor-vote'},
 {id:'caption', glyph:'\u270E', name:'Word Warrior',    ev:'pf-caption-submit'},
 {id:'poster',  glyph:'\u25C8', name:'Press Pass',      ev:'pf-poster-made'},
 {id:'quiz',    glyph:'\u25C9', name:'Intel Operative', ev:'pf-quiz-done'},
 {id:'orders',  glyph:'\u25B2', name:'Field Duty',      ev:'pf-order-checkin'},
 {id:'drop',    glyph:'\u25CF', name:'Supply Runner',   ev:'pf-drop-claimed'},
 {id:'enlisted',glyph:'\u2694', name:'Enlisted',        ev:'pf-enlisted'}
];
function chiNow(){try{return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'}));}catch(e){return new Date();}}
function weekKey(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);var first=new Date(Date.UTC(t.getUTCFullYear(),0,4));var fday=(first.getUTCDay()+6)%7;first.setUTCDate(first.getUTCDate()-fday+3);var w=1+Math.round((t-first)/(7*864e5));return t.getUTCFullYear()+'-W'+String(w).padStart(2,'0');}
function load(){try{var s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.w)return s;}catch(e){}return{w:weekKey(chiNow()),m:{},fd:false};}
function save(s){try{localStorage.setItem(LS,JSON.stringify(s));}catch(e){}}
function callsign(){try{return String(JSON.parse(localStorage.getItem(LS_I)||'{}').callsign||'').toLowerCase();}catch(e){return '';}}
/* JSONP GET (same pattern as ranks apiPost — avoids Apps Script POST redirect bug) */
function apiGet(params,cb){
  if(!BACKEND_URL){cb(null);return;}
  var cbn='pfm'+Date.now()+Math.floor(Math.random()*1e6);
  window[cbn]=function(d){try{delete window[cbn];}catch(e){}try{scr.parentNode.removeChild(scr);}catch(e){}cb(d);};
  var q='?callback='+encodeURIComponent(cbn);
  for(var k in params){if(params.hasOwnProperty(k))q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}
  var scr=document.createElement('script');scr.src=BACKEND_URL+q;scr.onerror=function(){cb(null);};
  (document.head||document.documentElement).appendChild(scr);
  setTimeout(function(){if(window[cbn]){try{delete window[cbn];}catch(e){}cb(null);}},15000);
}

function fullDeployment(s){
  if(s.fd||s.fd_pending)return;
  var cs=callsign();
  if(cs){
    /* backend: +50 XP (once/week, idempotent) + wall etch; fd=true only on confirmed success */

    if(!(j&&j.ok))return; /* keep fd_pending so a later claim retries */

  var h='<div class=\"pm-title\">\u2694 Service Medals <span>\u2014 this week</span></div><div class=\"pm-rack\">';

  }
  el.innerHTML=h;
  return true;
}
function checkFull(s){
  if(s.fd||s.fd_pending)return;
  for(var i=0;i<MEDALS.length;i++){if(!s.m[MEDALS[i].id])return;}
  fullDeployment(s);

MEDALS.forEach(function(md){
  document.addEventListener(md.ev,function(){
    var s=load(),wk=weekKey(chiNow());
    if(s.w!==wk){s={w:wk,m:{},fd:false};}
    if(!s.m[md.id]){s.m[md.id]=1;save(s);}
    checkFull(s);
    renderRack();
  });

/* if the user enlists mid-week, award the Enlisted medal retroactively */
document.addEventListener('pf-enlisted',function(){
  var s=load(),wk=weekKey(chiNow());
  if(s.w!==wk){s={w:wk,m:{},fd:false};}

});

/* mount the rack once the ranks widget exists */

function mount(){

  if(++tries<20)setTimeout(mount,1000);
}

else document.addEventListener('DOMContentLoaded',mount);
})();

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
function getMemeBlob(canvas,cleanImg,callback){
  try{
    var c=document.createElement('canvas');
    c.width=canvas.width;c.height=canvas.height;
    var ctx=c.getContext('2d');
    ctx.drawImage(canvas,0,0);
    c.toBlob(function(blob){
      if(blob){callback(blob);return;}
      redrawClean(canvas,cleanImg,callback);
    },'image/png');
  }catch(e){redrawClean(canvas,cleanImg,callback);}
}
function redrawClean(canvas,cleanImg,callback){
  try{
    var c=document.createElement('canvas');
    var w=canvas.width||500,h=canvas.height||622;
    c.width=w;c.height=h;
    var ctx=c.getContext('2d');
    var scale=Math.min(1,500/cleanImg.naturalWidth);
    var dw=cleanImg.naturalWidth*scale,dh=cleanImg.naturalHeight*scale;
    c.width=dw;c.height=dh;w=dw;h=dh;
    ctx.drawImage(cleanImg,0,0,w,h);
    var top=document.getElementById('mm-top');
    var bot=document.getElementById('mm-bottom');
    var topText=top?top.value.trim().toUpperCase():'';
    var botText=bot?bot.value.trim().toUpperCase():'';
    if(topText||botText){
      ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';
      ctx.lineWidth=Math.max(2,w/150);
      var fontSize=Math.max(20,w/12);
      ctx.font='bold '+fontSize+'px "Arial Black",Impact,Arial,sans-serif';
      function wrap(text){
        var words=text.split(' '),lines=[],line='';
        for(var i=0;i<words.length;i++){
          var test=line+words[i]+' ';
          if(ctx.measureText(test).width>w-20&&line){lines.push(line.trim());line=words[i]+' ';}
          else{line=test;}
        }
        lines.push(line.trim());return lines;
      }
      function drawLines(lines,startY){
        var lineH=fontSize*1.15;
        for(var j=0;j<lines.length;j++){
          var y=startY+j*lineH;
          ctx.strokeText(lines[j],w/2,y);ctx.fillText(lines[j],w/2,y);
        }
      }
      if(topText)drawLines(wrap(topText),fontSize+10);
      if(botText){var lines=wrap(botText),lineH=fontSize*1.15;drawLines(lines,h-10-(lines.length-1)*lineH);}
    }
    c.toBlob(function(blob){callback(blob);},'image/png');
  }catch(e){callback(null);}
}

function exportMeme(canvas,cleanImg,useShare){
  getMemeBlob(canvas,cleanImg,function(blob){
    if(!blob){alert('Could not generate image. Try a screenshot.');return;}
    if(useShare){
      var file=new File([blob],'propaganda-factory-meme.png',{type:'image/png'});
      if(navigator.share){
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:'Propaganda Factory Meme',text:'Made with The Propaganda Factory'}).catch(function(){});
          return;
        }
        if(isIOS()){
          var r=new FileReader();
          r.onload=function(){showIOSSaveModal(r.result);};
          r.readAsDataURL(blob);
          return;
        }
      }
    }
    if(isIOS()){
      var reader=new FileReader();
      reader.onload=function(){showIOSSaveModal(reader.result);};
      reader.readAsDataURL(blob);
    }else{
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='propaganda-factory-meme.png';
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},500);
    }
  });
}
function patchButtons(canvas,cleanImg){
  var dlBtn=document.getElementById('mm-download');
  var shareBtn=document.getElementById('mm-share');
  var controls=document.getElementById('pf-meme-controls');
  var btnContainer=controls?controls.querySelector('.mm-btns'):null;
  if(btnContainer&&!document.getElementById('mm-save-phone')){
    var saveBtn=document.createElement('a');
    saveBtn.className='c-btn ghost';saveBtn.id='mm-save-phone';saveBtn.href='#';
    saveBtn.textContent='Save to Phone';
    saveBtn.style.cssText='display:inline-block;background:none;border:2px solid #f5ead6;color:#f5ead6;font-size:11px;padding:9px 18px;font-family:"Arial Black",Arial,sans-serif;letter-spacing:2px;cursor:pointer;text-transform:uppercase;margin:5px;text-decoration:none;';
    btnContainer.appendChild(saveBtn);
    saveBtn.onclick=function(e){e.preventDefault();exportMeme(canvas,cleanImg,false);return false;};
  }
  if(shareBtn&&!shareBtn.dataset.pfPatched){
    shareBtn.dataset.pfPatched='1';
    shareBtn.onclick=function(e){e.preventDefault();exportMeme(canvas,cleanImg,true);return false;};
  }
  if(dlBtn&&!dlBtn.dataset.pfPatched){
    dlBtn.dataset.pfPatched='1';
    dlBtn.onclick=function(e){
      e.preventDefault();
      exportMeme(canvas,cleanImg,false);
      try{document.dispatchEvent(new CustomEvent('pf-poster-made',{detail:{via:'meme-maker'}}));}catch(err){}
      return false;
    };
  }
}

<script>/*PF-DOMETER-SHARE*/
(function(){
'use strict';
if(window.pfDometerShareLoaded)return;window.pfDometerShareLoaded=true;

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}

function mkCanvas(w,h){
  var c=document.createElement("canvas");c.width=w;c.height=h;return c;
}

function getDoMeterData(){
  var total=0,goal=1000;
  try{
    var el=document.getElementById("dCount");
    if(el){total=parseInt(el.textContent.replace(/[^0-9]/g,""),10)||0;}
    var goalEl=document.getElementById("dGoalLine");
    if(goalEl){
      var m=goalEl.textContent.match(/\/\s*([\d,]+)/);
      if(m){goal=parseInt(m[1].replace(/,/g,""),10)||1000;}
    }
  }catch(e){}
  if(total===0){
    try{
      var s=JSON.parse(localStorage.getItem("pf_do_v1")||"{}");
      if(s.total)total=s.total;
      if(s.goal)goal=s.goal;
    }catch(e){}
  }
  return{total:total,goal:goal};
}

function getNukeData(){
  var xp=0, goal=50000, status="";
  try{
    var label=document.getElementById("slr-nuke-label");
    if(label){
      var m=label.textContent.match(/([\d,]+)\s*\/\s*([\d,]+)/);
      if(m){ xp=parseInt(m[1].replace(/,/g,""),10)||0; goal=parseInt(m[2].replace(/,/g,""),10)||50000; }
    }
    var st=document.getElementById("slr-nuke-status");
    if(st){ status=(st.textContent||"").trim(); }
  }catch(e){}
  if(xp===0){
    try{
      var s=JSON.parse(localStorage.getItem("pf_nuke_local_v2")||"null");
      var today=new Date().toISOString().slice(0,10);
      if(s&&s.d===today&&s.xp){ xp=s.xp; }
    }catch(e){}
  }
  return {xp:xp, goal:goal, status:status};
}

function getCountdown(){
  try{
    var now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Chicago"}));
    var day=now.getDay();
    var daysUntilMonday=day===0?1:8-day;
    if(daysUntilMonday===1){
      return "1 DAY LEFT";
    }else{
      return daysUntilMonday+" DAYS LEFT";
    }
  }catch(e){return "";}
}

function drawNukeShare(){
  var data=getDoMeterData();
  var nuke=getNukeData();
  var countdown=getCountdown();
  var pct=Math.min(100,Math.round(data.total/data.goal*100));
  var nukePct=Math.min(100,Math.round(nuke.xp/nuke.goal*100));
  var W=1080,H=1700,c=mkCanvas(W,H),x=c.getContext("2d");
  x.fillStyle="#0d0d0d";x.fillRect(0,0,W,H);
  x.fillStyle="#c1121f";
  for(var i=0;i<W;i+=80){
    x.save();
    x.translate(i,0);
    x.rotate(Math.PI/4);
    x.fillRect(0,-100,40,300);
    x.restore();
  }
  x.fillStyle="#0d0d0d";x.fillRect(0,120,W,H-120);
  x.strokeStyle="#c1121f";x.lineWidth=12;x.strokeRect(24,24,W-48,H-48);
  x.textAlign="center";
  x.fillStyle="#ff5a00";x.font="900 120px 'Arial Black',Arial,sans-serif";
  x.fillText("\u2622", W/2, 280);
  x.fillStyle="#c1121f";x.font="900 72px 'Arial Black',Arial,sans-serif";
  x.fillText("MEDIA NUKE", W/2, 400);
  x.fillText("PENDING", W/2, 490);
  x.fillStyle="#8a8172";x.font="700 30px Arial,sans-serif";
  x.fillText("\u2014 THE DO METER \u2014", W/2, 590);
  x.fillStyle="#f5ead6";x.font="900 96px 'Arial Black',Arial,sans-serif";
  x.fillText(data.total.toLocaleString(), W/2, 690);
  x.fillStyle="#c9bfa8";x.font="32px Arial,sans-serif";
  x.fillText("THINGS DONE THIS WEEK", W/2, 740);
  x.fillStyle="#1a1a1a";x.fillRect(140,790,W-280,50);
  x.fillStyle="#c1121f";x.fillRect(140,790,(W-280)*pct/100,50);
  x.strokeStyle="#f5ead6";x.lineWidth=3;x.strokeRect(140,790,W-280,50);
  x.fillStyle="#ff5a00";x.font="900 36px 'Arial Black',Arial,sans-serif";
  x.fillText(pct+"% TO DETONATION", W/2, 900);

      if(v===undefined||v===null)continue;
      var A=mus[i][0],B=mus[i][1];
      if(String(v)===String(A.seed))picks.push({pk:A,op:B});
      else if(String(v)===String(B.seed))picks.push({pk:B,op:A});
    }
    if(picks.length){
      ct('MY LIQUIDATION HIT LIST',y,40,'#c1121f','900',5);y+=80;
      for(j=0;j<picks.length;j++){
        pickLine(picks[j].pk.seed,picks[j].pk.name,y,32);y+=42;
        var ol=wrap('over SEED '+picks[j].op.seed+' \u00B7 '+picks[j].op.name.toUpperCase(),W-200,22);
        for(var k=0;k<ol.length;k++){ct(ol[k],y,22,'#b8ab8e','700',2);y+=30;}
        y+=14;
        if(y>H-280)break;
      }
    }else{
      ct('16 BILLIONAIRES.',y,64,'#f5ead6','900',4);y+=92;
      ct('HEAD-TO-HEAD.',y,64,'#f5ead6','900',4);y+=92;
      y+=24;
      ct('YOU DECIDE WHO GETS',y,36,'#c1121f','900',4);y+=62;
      ct('LIQUIDATED FIRST.',y,36,'#c1121f','900',4);y+=84;
      ct('VOTE AT MTCSTW.COM',y,34,'#f5ead6','700',4);
    }
  }
  ct('MTCSTW.COM',H-170,44,'#f5ead6','900',6);
  ct('#SICKLEFTRADICALS',H-112,28,'#c1121f','700',4);
  return canvas;
}
function shareBracketPoster(btn){
  var msg=document.getElementById('pf-bracket-share-msg');
  var say=function(t){if(msg)msg.textContent=t;};
  if(btn)btn.disabled=true;
  say('Building your poster\u2026');
  /* Credit ONLY on a confirmed share or a completed download — never on cancel. */
  var credit=function(){if(btn)btn.disabled=false;
    try{document.dispatchEvent(new CustomEvent('pf-share-image',{detail:{day:new Date().toISOString().slice(0,10)}}));}catch(e){}};
  function dl(blob){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='liquidation-bracket.png';
    document.body.appendChild(a);a.click();
    setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}a.remove();},4000);
    say('Poster downloaded \u2014 on iPhone open it from Files/Downloads, tap Share, then Save Image to put it in Photos.');
    credit();
  }
  var canvas;
  try{canvas=bracketPoster();}catch(e){canvas=null;}
  if(!canvas||!canvas.toBlob){say('Poster failed \u2014 try again.');if(btn)btn.disabled=false;return;}
  canvas.toBlob(function(blob){
    if(!blob){say('Poster failed \u2014 try again.');if(btn)btn.disabled=false;return;}
    var file=null;
    try{file=new File([blob],'liquidation-bracket.png',{type:'image/png'});}catch(e){}
    var txt='My Liquidation Bracket hit list \u2014 16 billionaires, head-to-head. You decide who gets liquidated first. https://www.mtcstw.com #SickLeftRadicals';
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Liquidation Bracket',text:txt}).then(
        function(){say('Shared. Go spread the word.');credit();},
        function(e){if(btn)btn.disabled=false;
          if(e&&e.name==='AbortError'){say('Share cancelled.');}
          else{dl(blob);}});
    }else dl(blob);
  },'image/png');
}
/* The embed re-renders #bBody on every vote — re-inject the share row after each. */
function ensureRow(){
  if(!bodyEl.isConnected)return;
  if(document.getElementById('pf-bracket-share-row'))return;
  var n=Object.keys(loadVotes()).length;
  var row=document.createElement('div');
  row.id='pf-bracket-share-row';
  row.style.cssText='margin-top:14px;text-align:center;';
  var b=document.createElement('button');
  b.id='pf-bracket-share-btn';
  b.textContent=n>0?'SHARE YOUR HIT LIST':'SHARE THE BRACKET';
  b.style.cssText='background:#c1121f;color:#fff;border:3px solid #ff5a00;padding:12px 34px;font-family:"Arial Black",Arial,sans-serif;font-size:16px;letter-spacing:3px;cursor:pointer;text-transform:uppercase;';
  b.onmouseover=function(){b.style.background='#ff5a00';};
  b.onmouseout=function(){b.style.background='#c1121f';};
  b.onclick=function(){shareBracketPoster(b);};
  var m=document.createElement('div');
  m.id='pf-bracket-share-msg';
  m.style.cssText='font-family:Arial,sans-serif;font-size:12px;color:#ff5a00;margin-top:8px;min-height:16px;letter-spacing:1px;';
  row.appendChild(b);row.appendChild(m);
  bodyEl.appendChild(row);
}
ensureRow();
try{
  var mo=new MutationObserver(function(){ensureRow();});
  mo.observe(bodyEl,{childList:true});
}catch(e){}
})();
</script>
