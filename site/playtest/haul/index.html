<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>HAUL — a cozy freight garden</title>
<style>
  :root { --ink:#22312a; --paper:#f2efe6; --teal:#1f6f6b; --amber:#b97e26; --red:#b3402e; --line:#c9c2ae; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#aebfa5; font-family: ui-rounded, system-ui, -apple-system, sans-serif; color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; background:#c3d0b4; box-shadow:0 0 24px rgba(20,40,30,.25); }
  header { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--paper); border-bottom:1px solid var(--line); }
  header .brand { font-weight:800; letter-spacing:.14em; font-size:15px; }
  header .money { font-weight:800; color:var(--teal); font-size:16px; }
  #delta { font-weight:800; color:#b3402e; font-size:13.5px; min-width:52px; }
  #infl { font-weight:700; color:#5b4a8a; font-size:13.5px; }
  #events { display:none; padding:4px 10px; background:#f3e9d2; border-bottom:1px solid var(--line); font-size:12.5px; }
  #offer { display:none; padding:6px 10px; background:#fdf6e0; border-bottom:2px solid var(--gold); font-size:13px; }
  #offer button { margin-left:6px; }
  #events div { padding:1px 0; }
  header .clock { margin-left:auto; font-size:12.5px; opacity:.85; text-align:right; line-height:1.25; }
  .speeds { display:flex; gap:4px; }
  .speeds button, .card button, #newgame, #boardbtn, #skillbtn, #portbtn, #mktbtn, #crownbtn, #ladderbtn, #impbtn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:5px 9px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .speeds button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  #map { flex:1 1 auto; width:100%; touch-action:none; display:block; }
  #ticker { background:#2b3a31; color:#dfe7da; font-size:12px; padding:6px 10px; max-height:104px; overflow:hidden; }
  #ticker div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1.5px 0; opacity:.92; }
  #ticker .pay { color:#9fd6a4; } #ticker .rot { color:#f0a08e; } #ticker .warn { color:#f2cd7e; }
  #ticker .route { color:#a8cdea; } #ticker .buy { color:#d3b8ec; }
  #sheet { background:var(--paper); border-top:1px solid var(--line); padding:10px; min-height:118px; max-height:44dvh; overflow-y:auto; }
  .hint { font-size:13px; opacity:.85; line-height:1.5; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .card .sub { font-size:12px; opacity:.75; margin-bottom:6px; line-height:1.4; }
  .card table { width:100%; border-collapse:collapse; font-size:13px; margin:4px 0 8px; }
  .card td { padding:2.5px 0; } .card td.r { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:5px; background:#e3ddc9; border-radius:3px; overflow:hidden; width:86px; display:inline-block; vertical-align:middle; }
  .bar i { display:block; height:100%; background:var(--teal); }
  .card .row { display:flex; flex-wrap:wrap; gap:6px; }
  .card button.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
  .card button:disabled { opacity:.45; }
  .status { font-size:12.5px; padding:2px 0; opacity:.9; }
  #routes { font-size:12.5px; padding:6px 10px; background:#e9e4d2; border-top:1px solid var(--line); display:none; }
  #routes span { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:20px; padding:3px 6px 3px 10px; margin:2px 3px 2px 0; cursor:pointer; }
  #routes span.sel { border-color:var(--teal); background:#e2efec; }
  #routes b { cursor:pointer; color:var(--red); padding:0 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" id="brand">HAUL</div>
    <div class="money" id="money">$750</div>
    <span id="delta"></span>
    <span id="infl" title="Influence with the State"></span>
    <div class="speeds" id="speeds">
      <button data-s="0">⏸</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
    <canvas id="ring" width="36" height="36" style="flex:none" title="Outer arc: the season · inner arc: the day"></canvas>
    <div class="clock" id="clock">Day 1 · 00:00</div>
    <button id="boardbtn" title="Contracts board">📋</button>
    <button id="skillbtn" title="Company skills">🎓</button>
    <button id="portbtn" title="Portfolio — units & titles">🏦</button>
    <button id="mktbtn" title="The Market — shares, loans, the State">📈</button>
    <button id="crownbtn" title="The Crown — regional control & the Era Report">👑</button>
    <button id="impbtn" title="Improve — every way to spend, one desk">🛠</button>
    <button id="ladderbtn" title="The Ladder — the progression queue">🧭</button>
    <button id="viewbtn" title="Reset view" style="display:none">⤢</button>
    <button id="newgame" title="Start over">↺</button>
  </header>
  <canvas id="map"></canvas>
  <div id="chartbar" style="display:flex;gap:4px;padding:3px 10px;background:#f3e9d2;border-bottom:1px solid var(--line);font-size:12px;align-items:center"><span style="opacity:.75">Chart:</span><button data-chart="all">🌎 All</button><button data-chart="la">⚜ Louisiana</button><button data-chart="tx">★ Texas</button><button data-chart="river">🌊 The River</button><button id="duskbtn" title="Dusk — one overlay pass; Day stays the default light">🌗 Dusk</button><button id="zoomin" title="Step in — toward the selected place, else the chart's heart">⌕ Step in</button></div>
  <div id="events"></div>
  <div id="offer"></div>
  <div id="routes"></div>
  <div id="ticker"></div>
  <div id="sheet"></div>
</div>

<script type="module">
import { createWorld, restore, snapshot, queueIntent, flushIntents, tick, stockOf, distance, routeQuote, capOf, waterDistance, shipCallDays, riverCallDays, fisheryFactor, railDistance, ICE_MULT, TRACK_COST_PER_KM, YARD_COST, WATER_NODES, NODES, GOODS, VEHICLES, EDGES, SKILLS, UNITS, PRIMARY_UNIT, unitValue, unitManifest, positionsAt, availOf, HOUSES, STATE_DECK, EVENT_DECK, COASTAL, sharePrice, houseEquity, loanOwed, parcelPrice, eraReport, GROUNDS, LEVERAGES, OPENING_PRESETS, coverageOf, truckPos, companyOf, PAINTS, calendarOf, ladderOf, MAP_BOX, REFITS, WEATHERS } from './engine.js';

const SAVE_KEY = 'haul-save-v19';
const CURRENT_PHASE = 2.4; // Wave 16: THE SEAM + DORMANCY (LT-08 section 9) (saves migrate in restore())
// Purchases apply the moment they're tapped — money moves NOW, even paused.
const Q = it => { queueIntent(w, it); flushIntents(w); renderSheet(); };
// Map view: pinch / double-tap zoom, drag to pan (world CSS px -> screen CSS px)
const view = { s: 1, ox: 0, oy: 0, level: 2, region: 'la', anchorXY: null }; // zoom lives in LEVELS now (W38)
let w;
function bootWorld() {
  let start = {};
  try { start = JSON.parse(localStorage.getItem('haul-start') ?? '{}'); } catch { /* a bad start note never bricks the dock */ }
  return createWorld(20261106, { mode: start.mode === 'sandbox' ? 'sandbox' : 'campaign', ground: start.ground, leverage: start.leverage, companyName: start.companyName, paint: start.paint });
}
try { const s = localStorage.getItem(SAVE_KEY); w = s ? restore(s) : bootWorld(); }
catch { w = createWorld(20261106); }

let speed = 1, sel = null, pendingRoute = null, panel = null, trackMode = false, lastTickAt = performance.now(), acc = 0;
const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// Hotfix 0.4.2 (Shane: "Can't delete routes"): rebuilding innerHTML replaces
// the element under the player's finger, so a tap that starts on one copy of
// a button and ends on the next never becomes a click. Two rules fix it:
// render only when the HTML actually changes, and never repaint a panel
// within 400ms of a touch landing on it.
const _lastHTML = new Map(), _touchedAt = new Map();
function setHTML(el, html) { if (_lastHTML.get(el) === html) return false; _lastHTML.set(el, html); el.innerHTML = html; return true; }
function touched(el) { return performance.now() - (_touchedAt.get(el) ?? -1e9) < 400; }
for (const id of ['sheet', 'routes']) { const el = $(id); el.addEventListener('pointerdown', () => _touchedAt.set(el, performance.now()), true); }

function save() { try { localStorage.setItem(SAVE_KEY, snapshot(w)); } catch {} }
$('newgame').onclick = () => { panel = panel === 'start' ? null : 'start'; renderSheet(); };
$('boardbtn').onclick = () => { panel = panel === 'board' ? null : 'board'; renderSheet(); };
$('skillbtn').onclick = () => { panel = panel === 'skills' ? null : 'skills'; renderSheet(); };
$('portbtn').onclick = () => { panel = panel === 'portfolio' ? null : 'portfolio'; renderSheet(); };
$('mktbtn').onclick = () => { panel = panel === 'market' ? null : 'market'; renderSheet(); };
$('crownbtn').onclick = () => { panel = panel === 'crown' ? null : 'crown'; renderSheet(); };
$('ladderbtn').onclick = () => { panel = panel === 'ladder' ? null : 'ladder'; renderSheet(); };
$('impbtn').onclick = () => { panel = panel === 'improve' ? null : 'improve'; renderSheet(); };
$('speeds').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = +b.dataset.s;
  document.querySelectorAll('#speeds button').forEach(x => x.classList.toggle('on', x === b));
};

function fit() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', fit);
const WX0 = MAP_BOX.cx - MAP_BOX.hw, WXSPAN = MAP_BOX.hw * 2; // the chart frame IS the Fixed Box (W36)
const WY0 = MAP_BOX.cy - MAP_BOX.hh, WYSPAN = MAP_BOX.hh * 2;
function ptXY(x, y) {
  const r = cv.getBoundingClientRect();
  return { x: ((x - WX0) / WXSPAN) * r.width, y: ((y - WY0) / WYSPAN) * r.height };
}
function pt(id) { const n = NODES[id]; return ptXY(n.x, n.y); }
// Emblems (W35 — Shane: "little emblems so you don't have to click every place"):
// what a place IS, in one glyph; cities draw larger and keep their click-depth
const GLYPH = { port: '⚓', nola: '🎭', grandisle: '🏝', caneA: '🌾', caneB: '🌾', ricefarm: '🌾', mill: '🏭', dock: '🦐', delcambre: '🦐', processor: '🦐', timber: '🌲', sawmill: '🪵', refinery: '🛢', gasplant: '🔥', fourchon: '⚓', shipyard: '🔧', bogalusa: '📄', icehouse: '🧊', distributor: '🏬', batonrouge: '🏛', lafayette: '🎶', houstonPort: '⚓', houstonChem: '🧪', molding: '🧩', beaumont: '🛢', corpus: '⚓', victoria: '🌾', kingsville: '🐂', valley: '🍊', natchez: '🏛', vicksburg: '⚔', deltaFarms: '🌱', westHelena: '⚙', memphis: '🎸', cairo: '🌉', stLouis: '🌉' };
const CITIES = new Set(['nola', 'batonrouge', 'memphis', 'stLouis', 'houstonPort', 'distributor']);
const TOWNS_LIT = new Set(['lafayette', 'grandisle', 'natchez', 'vicksburg', 'cairo']); // towns wear lit windows at dusk (INTEGRATION-2.5D §7)
// Per-place lift (INTEGRATION-2.5D §3), the Desk's table carried to build scale
// (x0.34, bluff plinths folded in for Natchez and Vicksburg): height is class.
const PLACE_LIFT = { caneA: 1.7, caneB: 1.7, ricefarm: 1.7, timber: 1.4, victoria: 1.7, kingsville: 1.4, valley: 2.0, deltaFarms: 1.7, lafayette: 3.7, grandisle: 2.7, natchez: 5.4, vicksburg: 6.4, cairo: 3.1, westHelena: 4.8, docks: 5.1, delcambre: 4.4, port: 5.8, fourchon: 5.4, beaumont: 5.4, mill: 4.1, bogalusa: 4.1, sawmill: 3.7, processor: 3.7, refinery: 4.8, gasplant: 4.4, distributor: 4.1, shipyard: 4.4, molding: 4.1, houstonChem: 5.1, nola: 8.2, batonrouge: 7.5, houstonPort: 6.8, corpus: 7.1, memphis: 7.5, stLouis: 8.2 };
function mixHex(a, b, t) { // palette blends only - no new hues (the Desk's shading law); returns hex so blends compose
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
let dusk = false; // Day is the default light; Dusk is one overlay pass (section 7)
const liftEase = {}; // W39: each place's lift eases toward its dormancy class - wake is an event, never a pop-in
function nodeState(id) { // the ring tells the story: hungry blush · surging gold · thin amber · fed green
  const def = NODES[id], node = w.nodes[id];
  let worst = Infinity;
  for (const [good, rate] of Object.entries(def.consumes ?? {})) worst = Math.min(worst, stockOf(w, id, good) / Math.max(rate, 0.01));
  if (worst < 3) return '#b3402e';
  for (const [good, anchor] of Object.entries(def.anchors ?? {})) if ((node.prices[good] ?? anchor) > anchor * 1.25) return '#b8860b';
  if (worst < 6) return '#b97e26';
  return def.consumes ? '#3e9e5f' : null;
}
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / L2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

// what is this truck doing, in plain words — and whose hands are on the wheel (W36)
function statusText(v) {
  if (v.downTo > w.tick && v.sickTick > w.tick - 24) return `🤒 ${v.driver} is out sick — back tomorrow`;
  if (v.downTo > w.tick) return `in the shop till Day ${Math.floor(v.downTo / 24) + 1} (${v.driver} waits on the wrench)`;
  const r = w.routes.find(x => x.id === v.routeId);
  if (v.phase === 'loading') return `loading ${v.cargo.qty.toFixed(0)}t ${GOODS[v.cargo.good].name.toLowerCase()} at ${NODES[v.at].name}`;
  if (v.phase === 'unloading') return `unloading at ${NODES[v.at].name}`;
  if (v.phase === 'travel' && v.leg) {
    const left = Math.max(0, Math.round(v.leg.km - v.leg.progress));
    return v.cargo ? `hauling ${v.cargo.qty.toFixed(0)}t ${GOODS[v.cargo.good].name.toLowerCase()} → ${NODES[v.leg.to].name} · ${left} km out`
                   : `heading back to ${NODES[v.leg.to].name} · ${left} km out`;
  }
  if (r?.paused) return `parked — route paused`;
  if (r && VEHICLES[v.type].mode === 'water' && waterDistance(r.from, r.to) >= 999) return `beached — no water runs between these places`;
  if (r && VEHICLES[v.type].mode === 'rail' && railDistance(w, r.from, r.to) >= 999) return `no iron — trains need yards at both ends and laid track between them`;
  if (r && v.at === r.from) {
    const q = routeQuote(w, r.from, r.to);
    return q && stockOf(w, r.from, q.good) > 0.05 ? `ready at ${NODES[v.at].name}` : `waiting at ${NODES[v.at].name} — nothing to carry yet`;
  }
  if (r) return `repositioning to ${NODES[r.from].name}`;
  return `idle at ${NODES[v.at].name} — no route`;
}

// --- drawing ---
function draw(now) {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, r.height);
  g.addColorStop(0, '#c9d6bd'); g.addColorStop(1, '#a9bda0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  ctx.fillStyle = 'rgba(88,104,84,.30)'; ctx.fillRect(0, 0, r.width, r.height); // beyond the Ring, the chart recedes (W35)
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
  // THE RING (W35): the scope of the map, drawn as one boundary — the Gulf
  // Coast and the inland river country inside it; nothing outside pretends
  { ctx.beginPath();
    for (let k = 0; k <= 48; k++) { const a = k / 48 * Math.PI * 2, p = ptXY(MAP_BOX.cx + Math.cos(a) * (MAP_BOX.hw - 4), MAP_BOX.cy + Math.sin(a) * (MAP_BOX.hh - 4)); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
    ctx.closePath();
    ctx.fillStyle = 'rgba(247,242,222,.55)'; ctx.fill();
    // the rim (INTEGRATION-2.5D section 5): a Slate band, shadowed at its base, one light line riding the NW top
    ctx.strokeStyle = mixHex('#4E5A63', '#232519', .35); ctx.lineWidth = 10;
    ctx.save(); ctx.translate(0, 3); ctx.stroke(); ctx.restore();
    ctx.strokeStyle = '#4E5A63'; ctx.lineWidth = 10; ctx.stroke();
    ctx.strokeStyle = 'rgba(245,241,228,.3)'; ctx.lineWidth = 2;
    ctx.save(); ctx.translate(-2, -2); ctx.stroke(); ctx.restore();
    ctx.lineWidth = 1; }
  { // the Gulf sinks at the chart's south edge (section 4): depth, not paint
    const r2 = cv.getBoundingClientRect();
    ctx.save();
    ctx.beginPath();
    for (let k = 0; k <= 48; k++) { const a = k / 48 * Math.PI * 2, p = ptXY(MAP_BOX.cx + Math.cos(a) * (MAP_BOX.hw - 4), MAP_BOX.cy + Math.sin(a) * (MAP_BOX.hh - 4)); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
    ctx.closePath(); ctx.clip();
    const bot = ptXY(MAP_BOX.cx, MAP_BOX.cy + MAP_BOX.hh);
    const grd2 = ctx.createLinearGradient(0, bot.y - r2.height * .30, 0, bot.y + 10);
    grd2.addColorStop(0, 'rgba(46,74,107,0)'); grd2.addColorStop(1, 'rgba(46,74,107,.34)');
    ctx.fillStyle = grd2; ctx.fillRect(bot.x - r2.width, bot.y - r2.height * .30, r2.width * 2, r2.height * .30 + 20);
    ctx.restore(); }
  // the schematic river, sunk (section 4): a dark cut on the land side, the
  // water itself, a light lip on the sun side
  ctx.lineCap = 'round';
  const riverPath = () => { ctx.beginPath(); ctx.moveTo(r.width * .68, -10); ctx.bezierCurveTo(r.width * .60, r.height * .35, r.width * .78, r.height * .6, r.width * .74, r.height + 10); };
  ctx.strokeStyle = 'rgba(35,37,25,.40)'; ctx.lineWidth = 17;
  ctx.save(); ctx.translate(2.5, 3); riverPath(); ctx.stroke(); ctx.restore();
  ctx.strokeStyle = 'rgba(110,150,160,.35)'; ctx.lineWidth = 16; riverPath(); ctx.stroke();
  ctx.strokeStyle = 'rgba(245,241,228,.25)'; ctx.lineWidth = 2;
  ctx.save(); ctx.translate(-2, -2); riverPath(); ctx.stroke(); ctx.restore();
  ctx.lineWidth = 1;

  // the real corridors, faint — nothing else pretends to be a road
  ctx.strokeStyle = 'rgba(60,80,60,.22)';
  for (const [a, b] of EDGES) {
    const pa = pt(a), pb = pt(b);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  // laid iron: heavy dark line once down, dashed while the crews work
  for (const key of Object.keys(w.track)) {
    const [a, b] = key.split('|');
    const pa = pt(a), pb = pt(b);
    const done = w.track[key].doneTick <= w.tick;
    ctx.strokeStyle = done ? 'rgba(38,34,30,.9)' : 'rgba(38,34,30,.4)';
    ctx.lineWidth = done ? 3.4 : 2;
    if (!done) ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
  }
  // player routes
  for (const rt of w.routes) {
    const a = pt(rt.from), b = pt(rt.to);
    const isSel = sel?.kind === 'route' && sel.id === rt.id;
    const hasBarge = w.vehicles.some(v => v.routeId === rt.id && v.type === 'barge');
    ctx.strokeStyle = rt.paused ? 'rgba(120,120,110,.5)' : hasBarge ? 'rgba(47,95,158,.85)' : companyOf(w).paint;
    ctx.lineWidth = isSel ? 3.5 : 2.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.moveTo(b.x - Math.cos(ang) * 16, b.y - Math.sin(ang) * 16);
    ctx.lineTo(b.x - Math.cos(ang - .45) * 24, b.y - Math.sin(ang - .45) * 24);
    ctx.lineTo(b.x - Math.cos(ang + .45) * 24, b.y - Math.sin(ang + .45) * 24);
    ctx.fill(); ctx.lineWidth = 1;
  }
  // first-run pulse: start here
  if (!w.routes.length) {
    const p = pt('caneA'), rad = 18 + 5 * Math.sin(now / 300);
    ctx.strokeStyle = 'rgba(31,111,107,.65)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
  }
  // places, in the Desk's five moves (INTEGRATION-2.5D): shadow -> skirt -> top
  // face, then rim -> emblem -> label. Pass 1 grounds every place; the Dusk
  // overlay falls between the passes; pass 2 speaks (state never dims).
  const U = cv.width / (MAP_BOX.hw * 2); // backing px per data unit - place sizes belong to the geography now, not the screen
  const placeGeom = {};
  for (const [id, def] of Object.entries(NODES)) {
    const p = pt(id);
    const R = (CITIES.has(id) ? 6.3 : 5.4) * U;
    // dormancy (W39, LT-08 section 9): the lift eases toward the place's class
    const dorm = w.dormancy[id] ?? 2, dTarget = dorm === 0 ? (view.level === 1 ? 0 : 0.4) : dorm === 1 ? 0.4 : 1; // the dot is the CHART-distance form (LT-08 section 9): at Region and Ground a dormant place keeps a low grey silhouette - asleep, still a place
    liftEase[id] = liftEase[id] === undefined ? dTarget : liftEase[id] + (dTarget - liftEase[id]) * 0.04;
    const f = liftEase[id];
    if (f < 0.15) { // the dormant face: a chart dot - position + state, asleep not absent

function toWorld(e) {

}
function fitView(frame) { // a frame (data units) -> the one scale + offset that fits it
  const r = cv.getBoundingClientRect();

  return { s: sc, ox: -((frame.x[0] - WX0) / WXSPAN) * r.width * sc + (r.width - ((frame.x[1] - frame.x[0]) / WXSPAN) * r.width * sc) / 2,
               oy: -((frame.y[0] - WY0) / WYSPAN) * r.height * sc + (r.height - ((frame.y[1] - frame.y[0]) / WYSPAN) * r.height * sc) / 2 };

function levelFrame() { // W38: each level owns exactly one frame
  if (view.level === 1) return { x: [WX0, WX0 + WXSPAN], y: [WY0, WY0 + WYSPAN] };

let viewAnim = null; // level changes glide (W37 butter): easeOutCubic between the two frames
function animateView(to, dur = 280) {

}
function goLevel(level, opts = {}) {

function homeView(snap = false) { goLevel(2, { region: 'la', snap }); } // home: Level 2, Louisiana (W38)

function stepOut() { if (view.level === 3) goLevel(2); else if (view.level === 2) goLevel(1); else homeView(); }
let pinching = false, pinchCenter = null;

  view.ox = cx - wx * view.s; view.oy = cy - wy * view.s;
  pinchCenter = { x: WX0 + (cx - view.ox) / view.s / cv.getBoundingClientRect().width * WXSPAN, y: WY0 + (cy - view.oy) / view.s / cv.getBoundingClientRect().height * WYSPAN };
}
$('viewbtn').onclick = () => stepOut();
$('zoomin').onclick = () => { const d = Math.min(2, devicePixelRatio || 1); if (sel?.kind === 'node') { const p = pt(sel.id); stepIn(p.x / d, p.y / d); } else { const r = cv.getBoundingClientRect(); stepIn(r.width / 2, r.height / 2); } };
// chart pages (W31 - E1) are Level 2's regions now (W38)
const CHARTS = { la: { x: [-11, 146], y: [2, 166] }, tx: { x: [-94, 9], y: [21, 163] }, river: { x: [14, 82], y: [-174, 22] } }; // frames measured off the boxed layout (W37 spread)
document.querySelectorAll('[data-chart]').forEach(b => b.onclick = () => { const k = b.dataset.chart; if (!k) goLevel(1); else goLevel(2, { region: k }); });
$('duskbtn').onclick = () => { dusk = !dusk; $('duskbtn').style.background = dusk ? '#54513D' : ''; $('duskbtn').style.color = dusk ? '#f5f1e4' : ''; };
let lastWheelStep = 0;
cv.addEventListener('wheel', e => { e.preventDefault(); const now = performance.now(); if (now - lastWheelStep < 350) return; lastWheelStep = now; const p = toWorld(e); if (e.deltaY < 0) stepIn(p.x, p.y); else stepOut(); }, { passive: false });
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; dragged = false; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); dragged = true; }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    pinching = true;
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), r = cv.getBoundingClientRect();
    if (pinchD > 0) pinchZoom((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, view.s * d / pinchD);
    pinchD = d;
  } else if (pointers.size === 1 && downAt) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 9) dragged = true;
    if (dragged && view.level > 1) { viewAnim = null; view.ox += dx; view.oy += dy; clampView(); }
  }

cv.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pinching && pointers.size < 2) { // the stretch settles to the nearest level (W38)
    pinching = false; pinchD = 0;
    const home = fitView(levelFrame());
    const up = view.level < 3 ? fitView(view.level === 1 ? CHARTS[regionAt(pinchCenter?.x ?? MAP_BOX.cx, pinchCenter?.y ?? MAP_BOX.cy)] : { x: [(pinchCenter?.x ?? MAP_BOX.cx) - 48, (pinchCenter?.x ?? MAP_BOX.cx) + 48], y: [(pinchCenter?.y ?? MAP_BOX.cy) - 48, (pinchCenter?.y ?? MAP_BOX.cy) + 48] }) : null;
    const down = view.level > 1 ? fitView(view.level === 3 ? CHARTS[view.region] : { x: [WX0, WX0 + WXSPAN], y: [WY0, WY0 + WYSPAN] }) : null;
    if (up && view.s > (home.s + up.s) / 2) stepIn(pinchCenter?.x ?? MAP_BOX.cx, pinchCenter?.y ?? MAP_BOX.cy);

  if (dragged || !downAt || performance.now() - downAt.t > 600) { downAt = null; return; }
  downAt = null;
  const p = toWorld(e);
  // double-tap toggles zoom on the spot
  const now = performance.now();
  if (now - lastTap.t < 330 && Math.hypot(p.sx - lastTap.x, p.sy - lastTap.y) < 44) {
    stepIn(p.x, p.y); // double-tap steps a level in (W38)
    lastTap = { t: 0, x: 0, y: 0 };

cv.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); downAt = null; });
function handleTap(x, y) {
  panel = null;
  let hit = null, best = 27 / view.s;
  for (const id of Object.keys(NODES)) {
    const p = pt(id), d = Math.hypot(p.x - x, p.y - y);
    if (d < best) { best = d; hit = id; }
  }
  if (hit) {
    if (trackMode && sel?.kind === 'node' && sel.id !== hit) {
      const key = [sel.id, hit].sort().join('|');
      if (EDGES.some(([a, b]) => [a, b].sort().join('|') === key) && !w.track[key]) {
        Q({ type: 'layTrack', a: sel.id, b: hit });
        renderSheet(); return;
      }
    }
    if (sel?.kind === 'node' && sel.id !== hit) {
      trackMode = false;
      const existing = w.routes.find(rt => rt.from === sel.id && rt.to === hit);
      if (existing) sel = { kind: 'route', id: existing.id };

        sel = { kind: 'node', id: hit };
      }

    renderSheet(); return;
  }
  // tap a route line to manage it
  for (const rt of w.routes) {
    if (segDist(x, y, pt(rt.from), pt(rt.to)) < 14 / view.s) { sel = { kind: 'route', id: rt.id }; renderSheet(); return; }
  }
  sel = null; renderSheet();
}

// --- main loop: 1 tick = 1 game-hour = 0.4s at 1x (SIM-CORE cadence) ---
let prevMoney = null, flashUntil = 0;
function frame(now) {
  const dt = now - lastTickAt; lastTickAt = now;
  if (speed > 0) {
    acc += dt;
    const per = 400 / speed;

  }
  if (pendingRoute) {
    const rt = w.routes.find(x => x.from === pendingRoute.from && x.to === pendingRoute.to);

  $('money').textContent = '$' + Math.round(w.money).toLocaleString();
  $('brand').textContent = companyOf(w).name === 'Bayou Freight Co.' ? 'HAUL' : companyOf(w).name.toUpperCase().slice(0, 22);
  $('brand').style.color = companyOf(w).paint;
  if (prevMoney !== null && w.money < prevMoney - 19) { $('delta').textContent = '−$' + Math.round(prevMoney - w.money).toLocaleString(); flashUntil = now + 1400; }
  if (now > flashUntil && $('delta').textContent) $('delta').textContent = '';

  const openCount = w.contracts.filter(c => c.state === 'open').length;
  $('boardbtn').textContent = openCount ? `📋 ${openCount}` : '📋';
  $('skillbtn').textContent = w.skills.points ? `🎓 ${w.skills.points}` : '🎓';
  const ownedUnits = Object.values(w.units).filter(u => u.owner === 'player').length;
  $('portbtn').textContent = ownedUnits ? `🏦 ${ownedUnits}` : '🏦';
  $('mktbtn').textContent = w.emancipation ? '📈 !' : '📈';
  $('crownbtn').textContent = w.crown.ending ? '👑 !' : '👑';
  $('crownbtn').textContent = w.crown.ending ? '👑 !' : '👑';
  setHTML($('clock'), `${calendarOf(w).name} · Day ${day}<br>${String(hour).padStart(2, '0')}:00 ${WEATHERS[w.weather].icon}${w.refits.wire ? ` → ${WEATHERS[w.weatherNext].icon}` : ''}`);

    const rc = $('ring').getContext('2d');
    rc.clearRect(0, 0, 36, 36);

    rc.beginPath(); rc.arc(18, 18, 15, -Math.PI / 2, -Math.PI / 2 + (w.tick % 720) / 720 * Math.PI * 2); rc.stroke();
    rc.strokeStyle = '#7a5c1e';
    rc.beginPath(); rc.arc(18, 18, 10, -Math.PI / 2, -Math.PI / 2 + (w.tick % 24) / 24 * Math.PI * 2); rc.stroke();

}
frame.n = 0;
fit(); homeView(true); renderSheet();
requestAnimationFrame(frame);
addEventListener('beforeunload', save);
</script>
