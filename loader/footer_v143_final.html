function jsSeq(){
  var pending=JS_SEQ.length;
  function oneDone(){if(--pending===0){if(window.console)console.log('[PF] '+VER+' critical '+JS_SEQ.length+' files loaded');jsLazy();}}
  if(pending===0){jsLazy();return;}
  JS_SEQ.forEach(function(n){var s=document.createElement('script');s.src=BASE+n;s.async=false;
  s.onload=oneDone;s.onerror=function(){siloFail(n);oneDone();};
  document.head.appendChild(s);});
}
function loadBundle(n,cb){
  var s=document.createElement('script');s.src=BASE+n;s.async=true;
  s.onload=function(){try{if(window.PF&&PF.mountSilos)PF.mountSilos();}catch(e){} if(cb)cb();};
  s.onerror=function(){siloFail(n);if(cb)cb();};
  document.head.appendChild(s);

/* Lazy section bundles: each .pf-sec-anchor (injected by home-v2.js)
   names its bundle in data-bundle. Observe per section — a bundle loads
   when its section scrolls near the viewport. sec1 is already in JS_SEQ.
   Safety nets: 15s timeout loads everything; no-IO fallback loads all. */
function jsLazy(){
  var host=document.getElementById('pf-v2');
  if(!host){return;}
  var anchors=host.querySelectorAll('.pf-sec-anchor[data-bundle]');
  var pending={};
  var list=[];
  for(var i=0;i<anchors.length;i++){
    var b=anchors[i].getAttribute('data-bundle');
    if(b&&b!=='games/bundle-sec1.js'&&!pending[b]){pending[b]=1;list.push({a:anchors[i],b:b,done:false});}
  }
  if(!list.length)return;
  function fireOne(it){
    if(it.done)return;it.done=true;
    loadBundle(it.b);
  }
  function fireAll(){for(var k=0;k<list.length;k++)fireOne(list[k]);}
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(es){
      for(var k=0;k<es.length;k++){
        if(es[k]&&es[k].isIntersecting){
          for(var j=0;j<list.length;j++){
            if(list[j].a===es[k].target)fireOne(list[j]);
          }
        }
      }
    },{rootMargin:'800px'});
    try{
      for(var m=0;m<list.length;m++)obs.observe(list[m].a);
    }catch(e){fireAll();return;}
  }else{fireAll();return;}
  setTimeout(function(){fireAll();},15000);
}
CSS.forEach(css);jsSeq();
})();</script>
