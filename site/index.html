var toast = document.getElementById('kh-toast');
var toastT = null;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('kh-show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toast.classList.remove('kh-show'); }, 2200);
}
function fmt(n){ return Number(n||0).toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardEl(d){
  var el = document.createElement('div');
  el.className = 'kh-card' + (d.inference ? ' kh-inference' : '');
  var rowsHtml = (d.rows||[]).slice(0,4).map(function(r){
    return '<div class="kh-proof-row"><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>';
  }).join('');
  el.innerHTML =
    (d.inference ? '<div class="kh-kbadge">🧠 KARL NOTICED</div>' : '')+
    '<div class="kh-q">'+esc(d.q)+'</div>'+
    '<div class="kh-a">'+d.a+'</div>'+
    '<div class="kh-proof">'+
      '<div class="kh-exhibit">▸ EXHIBIT — VERIFIED</div>'+ rowsHtml +
      '<div class="kh-receipts">'+esc(d.src)+'</div>'+
      '<button class="kh-deploy-btn">DEPLOY</button>'+
    '</div>'+
    '<div class="kh-card-meta">'+
      '<span class="kh-deploys"><span class="n">'+fmt(d.deploys)+'</span> deployed</span>'+
      '<span><span class="kh-src">'+esc(String(d.src).split('—')[0].trim())+'</span> &middot; '+esc(d.when)+'</span>'+
    '</div>';
  el.addEventListener('click', function(e){
    if(e.target.classList.contains('kh-deploy-btn')) return;
    el.classList.toggle('kh-open');
  });
  var btn = el.querySelector('.kh-deploy-btn');
  var nEl = el.querySelector('.kh-deploys .n');
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(btn.classList.contains('kh-done')) return;
    btn.classList.add('kh-done');
    btn.textContent = 'DEPLOYED ✓';
    d.deploys = (d.deploys||0)+1;
    nEl.textContent = fmt(d.deploys);
    showToast('Deployed — the robbery report grows');
  });
  return el;
}

/* Seed feed */
SEED.forEach(function(d){ feed.appendChild(cardEl(d)); });

/* Karl's lead inference on every load */
(function leadInference(){
  var think = document.createElement('div');
  think.className = 'kh-card kh-thinking';
  think.innerHTML =
    '<div class="kh-tline"><span class="kh-pulse-dot"></span>Karl is connecting the dots&hellip;</div>'+
    '<div class="kh-shimmer"></div><div class="kh-shimmer" style="width:62%"></div>';
  feed.insertBefore(think, feed.firstChild);
  setTimeout(function(){
    var pick = INFERENCES[Math.floor(Math.random()*INFERENCES.length)];
    think.replaceWith(cardEl(pick));
  }, 800);
})();

/* Live stats */
(function loadStats(){
  fetch(API+'karl_stats', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.ok) return;
    var w=document.getElementById('kh-stat-wealth'),
        rr=document.getElementById('kh-stat-rows'),
        cc=document.getElementById('kh-stat-creators');
    if(w && d.wealth_display) w.textContent = d.wealth_display;
    if(rr && d.rows_display) rr.textContent = d.rows_display;
    if(cc && d.creators) cc.textContent = fmt(d.creators);
    var hint=document.getElementById('kh-hint');
    if(hint && d.rows_display) hint.innerHTML = esc(d.rows_display)+' records &middot; sourced answers';
  }).catch(function(){});
})();

/* Generic fact renderer for live karl_query results */
function factsToCard(q, r){
  var facts = r.facts||[];
  var rows = [], srcBits = [];
  facts.forEach(function(f){
    if(f.creators && f.creators.length){
      f.creators.slice(0,3).forEach(function(c){
        rows.push([c.name||'Creator', (c.propaganda_score?c.propaganda_score+'★ ':'')+(c.followers_display||'')]);
      });
      srcBits.push('slr_roster');
    }
    if(f.trades && f.trades.length){
      f.trades.slice(0,3).forEach(function(t){
        rows.push([(t.filer||'Insider'), (t.shares?fmt(t.shares)+' sh ':'')+(t.price?('@ $'+t.price):'')]);
      });
      srcBits.push('SEC Form 4');
    }
    if(f.positions && f.positions.length){
      f.positions.slice(0,3).forEach(function(p){
        rows.push([(p.person_name||p.name||'Person'), (p.org_name||'')]);
      });
      srcBits.push('LittleSis');
    }
    if(f.holdings && f.holdings.length){
      f.holdings.slice(0,3).forEach(function(h){
        var v=Number(h.value_usd||0);
        var vt = v>=1e9 ? '$'+(v/1e9).toFixed(1)+'B' : v>=1e6 ? '$'+(v/1e6).toFixed(1)+'M' : '$'+fmt(v);
        rows.push([(h.company_name||'Holding'), vt]);
      });
      srcBits.push('SEC 13F');
    }
    if(f.top_cases && f.top_cases.length){
      f.top_cases.slice(0,3).forEach(function(c){
        var p=Number(c.penalty||0);
        var pt = p>=1e9 ? '$'+(p/1e9).toFixed(1)+'B' : p>=1e6 ? '$'+(p/1e6).toFixed(1)+'M' : '$'+fmt(p);
        rows.push([(c.name||'Case'), pt]);
      });
      srcBits.push('enforcement records');
    }
    if(f.label && f.value_display){
      rows.push([f.label, f.value_display]);
      if(f.source && f.source.name) srcBits.push(f.source.name);
    }
  });
  /* fallback: first 3 scalar fields of first fact */
  if(!rows.length && facts.length){
    var f0 = facts[0];
    Object.keys(f0).slice(0,3).forEach(function(k){
      var v = f0[k];
      if(v==null || typeof v==='object') return;
      rows.push([k.replace(/_/g,' '), String(v).slice(0,40)]);
    });
  }
  if(!rows.length) return null;
  var src = srcBits.length ? '▸ RECEIPTS — '+srcBits.filter(function(v,i,a){return a.indexOf(v)===i;}).join(' · ') : '▸ RECEIPTS — Karl rails';
  var lead = rows[0];
  return {
    q: q,
    a: '<b>'+esc(lead[1])+'</b> — '+esc(lead[0])+'. Karl pulled this from the live rails.',
    rows: rows.slice(0,4), src: src, deploys: 0, when: "now"
  };
}

/* Ask flow — live karl_query */
var qInput = document.getElementById('kh-q');
var askBtn = document.getElementById('kh-askBtn');
document.getElementById('kh-chips').addEventListener('click', function(e){
  var t = e.target;
  if(!t.classList || !t.classList.contains('kh-chip')) return;
  qInput.value = t.textContent;
  qInput.focus();
  doAsk();
});
askBtn.addEventListener('click', doAsk);
qInput.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doAsk(); }
});

function doAsk(){
  var text = qInput.value.trim();
  if(!text || askBtn.disabled) return;
  askBtn.disabled = true;
  askBtn.textContent = '…';
  var load = document.createElement('div');
  load.className = 'kh-card';
  load.innerHTML = '<div class="kh-q">'+esc(text)+'</div><div class="kh-shimmer"></div><div class="kh-shimmer" style="width:70%"></div>';
  feed.insertBefore(load, feed.firstChild);
  load.scrollIntoView({behavior:'smooth', block:'center'});

  var done = function(card){
    var el = cardEl(card);
    el.classList.add('kh-open');
    load.replaceWith(el);
    qInput.value = '';
    askBtn.disabled = false;
    askBtn.textContent = 'ASK';
    showToast('Answer ready — tap DEPLOY to spread it');
  };

  fetch(API+'karl_query&q='+encodeURIComponent(text), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var card = (d && d.ok!==false) ? factsToCard(text, d) : null;
      if(card){ done(card); return; }
      /* fallback to canned keyword match */
      var hit = SEED.find(function(s){
        var kws = s.q.toLowerCase().split(/\s+/).filter(function(w){return w.length>4;});
        return kws.some(function(k){ return text.toLowerCase().indexOf(k)>-1; });
      });
      if(hit){ done(Object.assign({}, hit, {q:text, when:"now"})); return; }
      done({ q:text,
        a:"Karl searched the live rails and found <b>no direct match</b> — try naming a company, person, or industry.",
        rows:[["Template", d&&d.template?d.template:"unknown"],["Rails checked","27"]],
        src:"▸ RECEIPTS — Karl rails", deploys:0, when:"now" });
    })
    .catch(function(){
      done({ q:text,
        a:"The rails didn't answer — check your connection and try again.",
        rows:[["Status","offline"]], src:"▸ Karl", deploys:0, when:"now" });
    });
}

/* stagger cards on first paint */
setTimeout(function(){
  var cards = feed.querySelectorAll('.kh-card');
  cards.forEach(function(c,i){ c.style.animationDelay = (i*0.06)+'s'; });
}, 50);
})();
</script>
