<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checkout Canceled — The Propaganda Factory</title>
<meta name="description" content="No charge was made. The fight continues.">
<meta name="theme-color" content="#c1121f">
<link rel="icon" href="/v1.4.3/pwa/icon-192.png">
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .pf-box{text-align:center;max-width:520px;padding:40px 24px;}
  h1{font-family:Georgia,serif;font-size:clamp(28px,5vw,42px);margin:0 0 12px;}
  p{color:#aaa;font-size:16px;line-height:1.6;margin:0 0 32px;}
  .pf-btn{display:inline-block;background:#c1121f;color:#fff;text-decoration:none;font-weight:800;padding:14px 32px;border-radius:8px;margin:4px;}
  .pf-btn.ghost{background:transparent;border:1px solid #c1121f;}

  /* Uniform PF header (4-pillar) — added 2026-10-09 */
  .pf-topbar{
    position:fixed;top:0;left:0;right:0;z-index:10000;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px;
    background:#0a0a0a;
    border-bottom:1px solid #c1121f;
    touch-action:manipulation;
  }
  @media (display-mode: standalone){
    .pf-topbar{padding-top:48px;}
  }
  .pf-topbar-inner{
    max-width:960px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
  }
  .pf-topbar-brand{
    color:#fff;font-weight:900;font-size:16px;letter-spacing:.08em;
    text-decoration:none;flex:0 0 auto;
    touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(193,18,31,.3);
    cursor:pointer;padding:8px 2px;
  }
  .pf-topbar-brand span{color:#c1121f;}
  .pf-pillars-nav{
    display:flex;gap:6px;flex:1 1 auto;
  }
  .pf-pillars-nav::-webkit-scrollbar{display:none;}
  .pf-pillar{
    flex:1 1 0;text-align:center;text-decoration:none;
    background:transparent;border:1px solid #333;border-radius:8px;
    padding:10px 4px;color:#b0b0b0;
    font-size:11px;font-weight:700;letter-spacing:.06em;
    white-space:nowrap;
    touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(193,18,31,.3);
    cursor:pointer;
  }
  .pf-pillar:active{color:#fff;background:#1a1a1a;}
  .pf-tagline{display:none;}
</style>
</head>
<body>
<header class="pf-topbar">
  <div class="pf-topbar-inner">
    <a href="/" class="pf-topbar-brand" onclick="window.location.href='/';return false;">MTC<span>STW</span></a>
    <nav class="pf-pillars-nav" aria-label="Mission pillars">
      <a class="pf-pillar" href="/create">CREATE</a>
      <a class="pf-pillar" href="/sick-left-radicals">CONNECT</a>
      <a class="pf-pillar" href="/cells">COORDINATE</a>
      <a class="pf-pillar" href="/money">CAPITAL</a>
    </nav>
  </div>
  <p class="pf-tagline">JOIN THE FIGHT. Four ways in.</p>
</header>
<div class="pf-box">
  <h1>No Charge Made.</h1>
  <p>You canceled checkout — nothing was charged. The fight continues whenever you're ready.</p>
  <a class="pf-btn" href="/store">Back to Store</a>
  <a class="pf-btn ghost" href="/">HQ</a>
</div>
</body>
</html>
