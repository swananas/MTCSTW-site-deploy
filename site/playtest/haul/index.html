<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>HAUL — Phase 0.1.1 · The Loop, concept pass</title>
<style>
  :root { --ink:#22312a; --paper:#f2efe6; --teal:#1f6f6b; --amber:#b97e26; --red:#b3402e; --line:#c9c2ae; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#aebfa5; font-family: ui-rounded, system-ui, -apple-system, sans-serif; color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; background:#c3d0b4; box-shadow:0 0 24px rgba(20,40,30,.25); }
  header { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--paper); border-bottom:1px solid var(--line); }
  header .brand { font-weight:800; letter-spacing:.14em; font-size:15px; }
  header .money { font-weight:800; color:var(--teal); font-size:16px; }
  header .clock { margin-left:auto; font-size:12.5px; opacity:.85; text-align:right; line-height:1.25; }
  .speeds { display:flex; gap:4px; }
  .speeds button, .card button, #newgame { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:5px 9px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .speeds button.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  #map { flex:1 1 auto; width:100%; touch-action:none; display:block; }
  #ticker { background:#2b3a31; color:#dfe7da; font-size:12px; padding:6px 10px; max-height:104px; overflow:hidden; }
  #ticker div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1.5px 0; opacity:.92; }
  #ticker .pay { color:#9fd6a4; } #ticker .rot { color:#f0a08e; } #ticker .warn { color:#f2cd7e; }
  #ticker .route { color:#a8cdea; } #ticker .buy { color:#d3b8ec; }
  #sheet { background:var(--paper); border-top:1px solid var(--line); padding:10px; min-height:118px; }
  .hint { font-size:13px; opacity:.85; line-height:1.5; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .card .sub { font-size:12px; opacity:.75; margin-bottom:6px; line-height:1.4; }
  .card table { width:100%; border-collapse:collapse; font-size:13px; margin:4px 0 8px; }
  .card td { padding:2.5px 0; } .card td.r { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { height:5px; background:#e3ddc9; border-radius:3px; overflow:hidden; width:86px; display:inline-block; vertical-align:middle; }
  .bar i { display:block; height:100%; background:var(--teal); }
  .card .row { display:flex; flex-wrap:wrap; gap:6px; }
  .card button.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
  .card button:disabled { opacity:.45; }
  .status { font-size:12.5px; padding:2px 0; opacity:.9; }
  #routes { font-size:12.5px; padding:6px 10px; background:#e9e4d2; border-top:1px solid var(--line); display:none; }
  #routes span { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:20px; padding:3px 6px 3px 10px; margin:2px 3px 2px 0; cursor:pointer; }
  #routes span.sel { border-color:var(--teal); background:#e2efec; }
  #routes b { cursor:pointer; color:var(--red); padding:0 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">HAUL</div>
    <div class="money" id="money">$750</div>
    <div class="speeds" id="speeds">
      <button data-s="0">⏸</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
    <div class="clock" id="clock">Day 1 · 00:00</div>
    <button id="newgame" title="Start over">↺</button>
  </header>
  <canvas id="map"></canvas>
  <div id="routes"></div>
  <div id="ticker"></div>
  <div id="sheet"></div>
</div>

<script type="module">
import { createWorld, restore, snapshot, queueIntent, tick, stockOf, distance, routeQuote, NODES, GOODS, VEHICLES, EDGES } from './engine.js';

const SAVE_KEY = 'haul-save-v011';
let w;
try { const s = localStorage.getItem(SAVE_KEY); w = s ? restore(s) : createWorld(20261106); }
catch { w = createWorld(20261106); }

let speed = 1, sel = null, pendingRoute = null, lastTickAt = performance.now(), acc = 0;
const cv = document.getElementById('map'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

function save() { try { localStorage.setItem(SAVE_KEY, snapshot(w)); } catch {} }
$('newgame').onclick = () => { localStorage.removeItem(SAVE_KEY); w = createWorld(20261106); sel = null; pendingRoute = null; renderSheet(); };
$('speeds').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = +b.dataset.s;
  document.querySelectorAll('#speeds button').forEach(x => x.classList.toggle('on', x === b));
};

function fit() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', fit);
function pt(id) {
  const r = cv.getBoundingClientRect(), n = NODES[id];
  return { x: (n.x / 100) * r.width, y: (n.y / 100) * r.height };
}
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / L2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

// what is this truck doing, in plain words
function statusText(v) {
  const r = w.routes.find(x => x.id === v.routeId);
  if (v.phase === 'loading') return `loading ${v.cargo.qty.toFixed(0)}t ${GOODS[v.cargo.good].name.toLowerCase()} at ${NODES[v.at].name}`;
  if (v.phase === 'unloading') return `unloading at ${NODES[v.at].name}`;
  if (v.phase === 'travel' && v.leg) {
    const left = Math.max(0, Math.round(v.leg.km - v.leg.progress));
    return v.cargo ? `hauling ${v.cargo.qty.toFixed(0)}t ${GOODS[v.cargo.good].name.toLowerCase()} → ${NODES[v.leg.to].name} · ${left} km out`
                   : `heading back to ${NODES[v.leg.to].name} · ${left} km out`;
  }
  if (r?.paused) return `parked — route paused`;
  if (r && v.at === r.from) {
    const q = routeQuote(w, r.from, r.to);
    return q && stockOf(w, r.from, q.good) > 0.05 ? `ready at ${NODES[v.at].name}` : `waiting at ${NODES[v.at].name} — nothing to carry yet`;
  }
  if (r) return `repositioning to ${NODES[r.from].name}`;
  return `idle at ${NODES[v.at].name} — no route`;
}

// --- drawing ---
function draw(now) {
  const r = cv.getBoundingClientRect();
  const g = ctx.createLinearGradient(0, 0, 0, r.height);
  g.addColorStop(0, '#c9d6bd'); g.addColorStop(1, '#a9bda0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, r.width, r.height);
  ctx.strokeStyle = 'rgba(110,150,160,.35)'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(r.width * .68, -10); ctx.bezierCurveTo(r.width * .60, r.height * .35, r.width * .78, r.height * .6, r.width * .74, r.height + 10); ctx.stroke();
  ctx.lineWidth = 1;

  // the real corridors, faint — nothing else pretends to be a road
  ctx.strokeStyle = 'rgba(60,80,60,.22)';
  for (const [a, b] of EDGES) {
    const pa = pt(a), pb = pt(b);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  // player routes
  for (const rt of w.routes) {
    const a = pt(rt.from), b = pt(rt.to);
    const isSel = sel?.kind === 'route' && sel.id === rt.id;
    ctx.strokeStyle = rt.paused ? 'rgba(120,120,110,.5)' : isSel ? '#14524e' : 'rgba(31,111,107,.8)';
    ctx.lineWidth = isSel ? 3.5 : 2.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.moveTo(b.x - Math.cos(ang) * 16, b.y - Math.sin(ang) * 16);
    ctx.lineTo(b.x - Math.cos(ang - .45) * 24, b.y - Math.sin(ang - .45) * 24);
    ctx.lineTo(b.x - Math.cos(ang + .45) * 24, b.y - Math.sin(ang + .45) * 24);
    ctx.fill(); ctx.lineWidth = 1;
  }
  // vehicles
  for (const v of w.vehicles) {
    let p = null;
    if (v.phase === 'travel' && v.leg) {
      const a = pt(v.leg.from), b = pt(v.leg.to), f = v.leg.km ? v.leg.progress / v.leg.km : 0;
      p = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    } else if (v.at) p = pt(v.at);
    if (!p) continue;
    ctx.fillStyle = v.cargo ? '#22312a' : '#5a6e60';
    ctx.beginPath(); ctx.arc(p.x, p.y, v.type === 'semi' ? 5 : 4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke(); ctx.lineWidth = 1;
  }
  // first-run pulse: start here
  if (!w.routes.length) {
    const p = pt('caneA'), rad = 18 + 5 * Math.sin(now / 300);
    ctx.strokeStyle = 'rgba(31,111,107,.65)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
  }
  // nodes
  for (const [id, def] of Object.entries(NODES)) {
    const p = pt(id), node = w.nodes[id];
    const lots = node.lots.filter(l => l.good === 'shrimp');
    if (lots.length) {
      const oldest = lots.reduce((a, b) => a.born < b.born ? a : b);
      const remain = Math.max(0, 1 - (w.tick - oldest.born) / GOODS.shrimp.perishHours);
      ctx.strokeStyle = remain > .5 ? '#3e9e5f' : remain > .25 ? '#b97e26' : '#b3402e';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 17, -Math.PI / 2, -Math.PI / 2 + remain * Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
    }
    const isSel = sel?.kind === 'node' && sel.id === id;
    ctx.fillStyle = isSel ? '#fff8e2' : '#f5f1e4';
    ctx.strokeStyle = 'rgba(34,49,42,.55)'; ctx.lineWidth = isSel ? 2.4 : 1.2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, 7); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#22312a'; ctx.font = '700 9px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(def.name.split(' ').map(s => s[0]).slice(0, 2).join(''), p.x, p.y + 3);
    ctx.font = '10.5px system-ui'; ctx.fillStyle = 'rgba(34,49,42,.85)';
    ctx.fillText(def.name, p.x, p.y + 24);
    let i = 0;
    for (const good of Object.keys(GOODS)) {
      const q = stockOf(w, id, good);
      if (q >= 1) {
        ctx.fillStyle = 'rgba(31,111,107,.8)';
        ctx.fillRect(p.x - 14 + i * 7, p.y - 20, Math.min(6, 1 + q / 12), 3.5);
        i++;
      }
    }
  }
  // THE MAP QUOTES YOU: with a place selected, every destination shows its money
  if (sel?.kind === 'node') {
    ctx.font = '700 10.5px system-ui'; ctx.textAlign = 'center';
    for (const id of Object.keys(NODES)) {
      if (id === sel.id) continue;
      const p = pt(id);
      const existing = w.routes.find(rt => rt.from === sel.id && rt.to === id);
      const q = routeQuote(w, sel.id, id);
      let text = null, bg = '#22312a';
      if (existing) { text = '▸ running — tap to open'; bg = '#1f6f6b'; }
      else if (q && q.spreadPerTon > 0) text = `+$${q.spreadPerTon.toFixed(0)}/t · ${GOODS[q.good].name}`;
      if (!text) continue;
      const width = ctx.measureText(text).width + 12;
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(p.x - width / 2, p.y - 40, width, 16, 8); ctx.fill();
      ctx.fillStyle = '#f2efe6'; ctx.fillText(text, p.x, p.y - 28.5);
    }
  }
}

// --- sheets ---
function goodsRows(id) {
  const def = NODES[id], rows = [];
  for (const [good, g] of Object.entries(GOODS)) {
    const q = stockOf(w, id, good), price = w.nodes[id].prices[good];
    const role = def.converts?.in === good ? 'feeds on it' : def.produces?.[good] ? 'produces' : def.consumes?.[good] ? (def.export ? 'exports' : 'consumes') : null;
    if (!role && q < 0.05 && !price) continue;
    const pct = Math.min(100, q / 1.2);
    rows.push(`<tr><td>${g.name} ${role ? `<span style="opacity:.6">· ${role}</span>` : ''}</td>
      <td><span class="bar"><i style="width:${pct}%"></i></span></td>
      <td class="r">${q.toFixed(1)}t</td><td class="r">${price ? '$' + price.toFixed(0) + '/t' : '—'}</td></tr>`);
  }
  return rows.join('') || '<tr><td style="opacity:.6">Nothing here yet.</td></tr>';
}
function renderSheet() {
  const el = $('sheet');
  if (sel?.kind === 'route') {
    const rt = w.routes.find(x => x.id === sel.id);
    if (!rt) { sel = null; return renderSheet(); }
    const q = routeQuote(w, rt.from, rt.to);
    const trucks = w.vehicles.filter(v => v.routeId === rt.id);
    el.innerHTML = `<div class="card"><h3>${NODES[rt.from].name} → ${NODES[rt.to].name}</h3>
      <div class="sub">${distance(rt.from, rt.to)} km · ${rt.trips} trips · <b>$${rt.earned.toLocaleString()} earned</b>${q ? ` · now paying ~$${q.spreadPerTon.toFixed(0)}/t for ${GOODS[q.good].name.toLowerCase()}` : ''}${rt.paused ? ' · <b>PAUSED</b>' : ''}</div>
      ${trucks.map(v => `<div class="status">🚚 ${VEHICLES[v.type].name} — ${statusText(v)}</div>`).join('') || '<div class="status">No truck on this route yet — add one below and it starts on the next tick.</div>'}
      <div class="row" style="margin-top:6px">
        <button class="primary" id="b-addbox" ${w.money < VEHICLES.box.cost ? 'disabled' : ''}>＋ Box truck · $${VEHICLES.box.cost}</button>
        <button class="primary" id="b-addsemi" ${w.money < VEHICLES.semi.cost ? 'disabled' : ''}>＋ 18-wheeler · $${VEHICLES.semi.cost}</button>
        <button id="b-pause">${rt.paused ? 'Resume route' : 'Pause route'}</button>
        <button id="b-rm">Remove</button>
      </div></div>`;
    $('b-addbox').onclick = () => queueIntent(w, { type: 'buyVehicle', vehicleType: 'box', nodeId: rt.from, routeId: rt.id });
    $('b-addsemi').onclick = () => queueIntent(w, { type: 'buyVehicle', vehicleType: 'semi', nodeId: rt.from, routeId: rt.id });
    $('b-pause').onclick = () => queueIntent(w, { type: 'toggleRoute', routeId: rt.id });
    $('b-rm').onclick = () => { queueIntent(w, { type: 'removeRoute', routeId: rt.id }); sel = null; };
    return;
  }
  if (!sel) {
    const q = routeQuote(w, 'caneA', 'mill');
    el.innerHTML = !w.routes.length
      ? `<div class="hint"><b>Start here:</b> tap <b>Cane Field A</b> — the map will show you what every place pays for what it grows. Then tap the <b>Thibodaux Mill</b>: it pays about <b>+$${q ? q.spreadPerTon.toFixed(0) : '20'}/t</b> for cane, and your truck is already parked at the field.</div>`
      : `<div class="hint"><b>Tap a place</b> to see its stocks — and what every other place pays for what it has. <b>Tap a route</b> (or its chip below) to manage its trucks. Empire's shrimp dies in 72 hours; watch the ring.</div>`;
    return;
  }
  const id = sel.id, def = NODES[id];
  const here = w.vehicles.filter(v => v.at === id);
  el.innerHTML = `<div class="card"><h3>${def.name}</h3>
    <div class="sub">The pills on the map are live quotes: tap a destination to draw the route and put a truck on it.</div>
    <table>${goodsRows(id)}</table>
    ${here.map(v => `<div class="status">🚚 ${VEHICLES[v.type].name} — ${statusText(v)}</div>`).join('')}
    <div class="row">
      <button id="b-box" ${w.money < VEHICLES.box.cost ? 'disabled' : ''}>Buy box truck here · $${VEHICLES.box.cost}</button>
      <button id="b-semi" ${w.money < VEHICLES.semi.cost ? 'disabled' : ''}>Buy 18-wheeler here · $${VEHICLES.semi.cost}</button>
    </div></div>`;
  $('b-box').onclick = () => queueIntent(w, { type: 'buyVehicle', vehicleType: 'box', nodeId: id });
  $('b-semi').onclick = () => queueIntent(w, { type: 'buyVehicle', vehicleType: 'semi', nodeId: id });
}
function renderRoutes() {
  const el = $('routes');
  if (!w.routes.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = w.routes.map(r => {
    const n = w.vehicles.filter(v => v.routeId === r.id).length;
    return `<span data-sel="${r.id}" class="${sel?.kind === 'route' && sel.id === r.id ? 'sel' : ''}">${NODES[r.from].name} → ${NODES[r.to].name} · ${n}🚚 · $${r.earned.toLocaleString()}<b data-rm="${r.id}">✕</b></span>`;
  }).join('');
  el.querySelectorAll('[data-sel]').forEach(s => s.onclick = e => {
    if (e.target.dataset.rm) return;
    sel = { kind: 'route', id: +s.dataset.sel }; renderSheet();
  });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => queueIntent(w, { type: 'removeRoute', routeId: +b.dataset.rm }));
}
function renderTicker() {
  $('ticker').innerHTML = w.ticker.slice(-5).reverse().map(t => `<div class="${t.kind}">${t.text}</div>`).join('');
}

// --- input: tap-tap connects, and the money is showing before you commit ---
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let hit = null, best = 32;
  for (const id of Object.keys(NODES)) {
    const p = pt(id), d = Math.hypot(p.x - x, p.y - y);
    if (d < best) { best = d; hit = id; }
  }
  if (hit) {
    if (sel?.kind === 'node' && sel.id !== hit) {
      const existing = w.routes.find(rt => rt.from === sel.id && rt.to === hit);
      if (existing) sel = { kind: 'route', id: existing.id };
      else {
        queueIntent(w, { type: 'addRoute', from: sel.id, to: hit });
        pendingRoute = { from: sel.id, to: hit };
        sel = { kind: 'node', id: hit };
      }
    } else sel = { kind: 'node', id: hit };
    renderSheet(); return;
  }
  // tap a route line to manage it
  for (const rt of w.routes) {
    if (segDist(x, y, pt(rt.from), pt(rt.to)) < 14) { sel = { kind: 'route', id: rt.id }; renderSheet(); return; }
  }
  sel = null; renderSheet();
});

// --- main loop: 1 tick = 1 game-hour = 0.4s at 1x (SIM-CORE cadence) ---
function frame(now) {
  const dt = now - lastTickAt; lastTickAt = now;
  if (speed > 0) {
    acc += dt;
    const per = 400 / speed;
    let n = 0;
    while (acc >= per && n++ < 40) { tick(w); acc -= per; if (w.tick % 24 === 0) save(); }
  }
  if (pendingRoute) {
    const rt = w.routes.find(x => x.from === pendingRoute.from && x.to === pendingRoute.to);
    if (rt) { sel = { kind: 'route', id: rt.id }; pendingRoute = null; renderSheet(); }
  }
  const day = Math.floor(w.tick / 24) + 1, hour = w.tick % 24;
  $('money').textContent = '$' + Math.round(w.money).toLocaleString();
  $('clock').innerHTML = `Season ${Math.floor((day - 1) / 30) + 1} · Day ${day}<br>${String(hour).padStart(2, '0')}:00`;
  draw(now); renderTicker(); renderRoutes();
  if (frame.n++ % 20 === 0) renderSheet();
  requestAnimationFrame(frame);
}
frame.n = 0;
fit(); renderSheet();
requestAnimationFrame(frame);
addEventListener('beforeunload', save);
</script>
</body>
</html>
